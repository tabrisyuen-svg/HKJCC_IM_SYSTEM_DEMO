<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>點名統計報告 · D-03</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --green:#1B6E3C;--gl:#24A05A;--yellow:#F5C518;
  --dark:#0D1B2A;--card:#162032;--card2:#1E2D42;
  --border:#2A3D55;--text:#E8EDF3;--muted:#7A90A8;
  --pos:#22C55E;--neg:#EF4444;--late:#F59E0B;--exc:#3B82F6;
}
body{font-family:'Segoe UI','Microsoft JhengHei',sans-serif;background:var(--dark);color:var(--text);min-height:100vh;}
.wrap{padding:16px;display:flex;flex-direction:column;gap:12px;max-width:1300px;margin:0 auto;}
.hdr{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;}
.hdr-l h1{font-size:20px;font-weight:700;}.hdr-l h1 span{color:var(--yellow);}
.hdr-l p{font-size:12px;color:var(--muted);margin-top:2px;}
.hdr-r{display:flex;gap:7px;align-items:center;flex-wrap:wrap;}
.demo-badge{background:var(--yellow);color:#000;font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;}
.rt-badge{font-size:10px;color:var(--muted);background:var(--card2);border:1px solid var(--border);padding:3px 9px;border-radius:20px;white-space:nowrap;}
.ci{background:var(--card2);border:1px solid var(--border);border-radius:7px;padding:7px 10px;color:var(--text);font-size:12px;outline:none;}
.ci:focus{border-color:var(--gl);}select.ci option{background:var(--card2);}
.btn{padding:7px 14px;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;border:1px solid;transition:all .14s;display:inline-flex;align-items:center;gap:5px;}
.btn:active{transform:scale(.97);}
.btn-g{background:var(--green);color:#fff;border-color:var(--green);}.btn-g:hover{background:var(--gl);}
.btn-o{background:transparent;color:var(--muted);border-color:var(--border);}.btn-o:hover{background:var(--card2);color:var(--text);}

/* Alert */
.alrt-ban{border-radius:10px;padding:10px 14px;display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;}
.alrt-ban.warn{background:rgba(239,68,68,.07);border:1px solid rgba(239,68,68,.25);}
.alrt-ban.ok{background:rgba(34,197,94,.07);border:1px solid rgba(34,197,94,.2);}
.alrt-ico{font-size:16px;flex-shrink:0;margin-top:1px;}
.alrt-body{flex:1;}
.alrt-title{font-size:13px;font-weight:700;margin-bottom:5px;}
.alrt-ban.warn .alrt-title{color:#FCA5A5;}.alrt-ban.ok .alrt-title{color:#86EFAC;}
.alrt-chips{display:flex;gap:5px;flex-wrap:wrap;}
.chip{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;}
.chip-r{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);color:#FCA5A5;}
.chip-g{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.25);color:#86EFAC;}

/* KPI */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:9px;}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;}
.kpi-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;}
.kpi-val{font-size:24px;font-weight:700;line-height:1;}
.kpi-sub{font-size:10px;color:var(--muted);margin-top:4px;}
.kpi-val.g{color:var(--pos);}.kpi-val.r{color:var(--neg);}.kpi-val.y{color:var(--yellow);}.kpi-val.b{color:#93C5FD;}

/* Tabs */
.tab-bar{display:flex;background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;width:fit-content;flex-wrap:wrap;}
.tab{padding:9px 18px;font-size:13px;cursor:pointer;color:var(--muted);transition:all .15s;font-weight:500;white-space:nowrap;user-select:none;}
.tab.on{background:var(--green);color:#fff;}.tab:hover:not(.on){background:var(--card2);color:var(--text);}

/* Section */
.sec{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.shdr{padding:11px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.shdr h3{font-size:14px;font-weight:600;}.shdr-r{margin-left:auto;display:flex;gap:7px;align-items:center;flex-wrap:wrap;}
.tbl-wrap{overflow-x:auto;}
table.mt{width:100%;border-collapse:collapse;}
.mt th{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;padding:9px 10px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--card);}
.mt th.c{text-align:center;}.mt th.r{text-align:right;}
.mt td{padding:8px 10px;font-size:13px;border-bottom:1px solid rgba(42,61,85,.28);vertical-align:middle;}
.mt td.c{text-align:center;}.mt td.r{text-align:right;}
.mt tr:last-child td{border-bottom:none;}
.mt tr:hover td{background:rgba(30,45,66,.45);}
.mt tr.clk{cursor:pointer;}.mt tr.clk:hover td{background:rgba(36,160,90,.07);}
.pct{font-weight:700;}.pct.hi{color:var(--pos);}.pct.md{color:var(--yellow);}.pct.lo{color:var(--neg);}
.rate-bar{width:72px;height:5px;background:var(--card2);border-radius:3px;overflow:hidden;display:inline-block;vertical-align:middle;margin-left:7px;}
.rate-fill{height:100%;border-radius:3px;}
.sb{display:inline-flex;padding:2px 7px;border-radius:20px;font-size:11px;font-weight:700;}
.sb-P{background:rgba(34,197,94,.14);color:#4ADE80;}
.sb-A{background:rgba(239,68,68,.14);color:#FCA5A5;}
.sb-L{background:rgba(245,158,11,.14);color:#FDE68A;}
.sb-E{background:rgba(59,130,246,.14);color:#93C5FD;}
.ol{display:inline-flex;padding:2px 7px;border-radius:5px;font-size:10px;font-weight:700;margin-left:3px;}
.ol-a{background:rgba(239,68,68,.15);color:#FCA5A5;}
.ol-l{background:rgba(245,158,11,.15);color:#FDE68A;}
.empty{text-align:center;padding:36px;color:var(--muted);font-size:13px;}
.foot-note{padding:10px 16px;font-size:11px;color:var(--muted);border-top:1px solid rgba(42,61,85,.3);}

/* Modal */
.mb-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:500;display:flex;align-items:center;justify-content:center;padding:16px;}
.mb-bg.hide{display:none;}
.mb-box{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;width:100%;max-width:640px;max-height:90vh;overflow-y:auto;}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.mh h3{font-size:15px;font-weight:700;}
.mx{width:28px;height:28px;border-radius:7px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;}
.mx:hover{background:var(--card2);}
.m-info{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:12px;color:var(--muted);line-height:2;margin-bottom:12px;}
.m-info strong{color:var(--text);}
.m-kpi-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px;}
.m-kpi{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:8px 11px;flex:1;min-width:70px;text-align:center;}
.m-kpi-val{font-size:20px;font-weight:700;}.m-kpi-lbl{font-size:10px;color:var(--muted);margin-top:2px;}
.verify-note{background:rgba(36,160,90,.05);border:1px solid rgba(36,160,90,.15);border-radius:7px;padding:8px 12px;font-size:11px;color:#86EFAC;margin-bottom:10px;}

/* Toast */
.toast{position:fixed;bottom:20px;right:20px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:11px 16px;font-size:13px;display:flex;align-items:center;gap:8px;box-shadow:0 8px 28px rgba(0,0,0,.5);z-index:999;transform:translateY(60px);opacity:0;transition:all .24s;pointer-events:none;max-width:320px;}
.toast.on{transform:none;opacity:1;}

@media(max-width:640px){
  .wrap{padding:10px;}.kpi-val{font-size:20px;}.tab{padding:7px 11px;font-size:11px;}
}
::-webkit-scrollbar{width:5px;height:5px;}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
</style>
</head>
<body>
<div class="wrap">

<div class="hdr">
  <div class="hdr-l">
    <h1>點名統計報告 <span>D-03</span></h1>
    <p>出席率分析 · 未點名班別提示 · 缺席遲到超標追蹤</p>
  </div>
  <div class="hdr-r">
    <span class="demo-badge">DEMO</span>
    <span class="rt-badge" id="renderMs">計算中…</span>
    <select class="ci" id="classFilter" onchange="onFilter()">
      <option value="">全部班別</option>
    </select>
    <input type="month" class="ci" id="monthFilter" value="2026-11" onchange="onFilter()">
    <button class="btn btn-g" onclick="doExport()">📥 匯出 Excel</button>
  </div>
</div>

<div id="alertBan"></div>
<div class="kpi-row" id="kpiRow"></div>

<div class="tab-bar">
  <div class="tab on"  id="tab-cls" onclick="switchTab('cls')">🏫 班別總覽</div>
  <div class="tab"     id="tab-day" onclick="switchTab('day')">📅 日出席率</div>
  <div class="tab"     id="tab-mon" onclick="switchTab('mon')">📆 月出席率</div>
  <div class="tab"     id="tab-ovl" onclick="switchTab('ovl')">🚨 超標名單</div>
</div>

<div id="pane-cls"></div>
<div id="pane-day" style="display:none"></div>
<div id="pane-mon" style="display:none"></div>
<div id="pane-ovl" style="display:none"></div>

</div>

<!-- Modal -->
<div class="mb-bg hide" id="modal">
  <div class="mb-box">
    <div class="mh">
      <h3 id="modTitle">出席記錄</h3>
      <button class="mx" onclick="closeMod()">✕</button>
    </div>
    <div id="modBody"></div>
  </div>
</div>

<div class="toast" id="toast"><span id="tIco"></span><span id="tMsg"></span></div>

<script>
// ── Constants ──────────────────────────────────────────────────────
const TODAY       = '2026-11-09';
const UNCALLED    = ['2B', '3A'];   // 今日未點名班別
const ABS_THRESH  = 2;              // 月缺席 ≥2 超標
const LAT_THRESH  = 3;              // 月遲到 ≥3 超標
const MONTHS      = ['2026-10','2026-11'];
const STATUS_LABEL= {P:'出席',A:'缺席',L:'遲到',E:'有事假'};

// ── Seeded RNG (deterministic demo data) ──────────────────────────
let _s = 0xDEADBEEF;
function rnd(){_s^=_s<<13;_s^=_s>>17;_s^=_s<<5;return(_s>>>0)/0xFFFFFFFF;}

// ── Classes & Students ────────────────────────────────────────────
const CLASSES=[
  {id:'1A',name:'中一 1A'},{id:'1B',name:'中一 1B'},
  {id:'2A',name:'中二 2A'},{id:'2B',name:'中二 2B'},
  {id:'3A',name:'中三 3A'},{id:'3B',name:'中三 3B'},
];
const _SN=[['陳','大文'],['李','美玲'],['王','志明'],['張','美儀'],['黃','偉強'],['林','曉彤'],
           ['趙','文龍'],['吳','嘉怡'],['鄭','志豪'],['何','雅詩'],['蔡','國輝'],['梁','心怡']];
const STUDENTS={};
CLASSES.forEach(cls=>{
  STUDENTS[cls.id]=_SN.map(([s,g],i)=>({
    id:`${cls.id}-${String(i+1).padStart(2,'0')}`,name:s+g,no:i+1,classId:cls.id
  }));
});

// ── School days (Oct 5 – Nov 9, 2026, weekdays) ───────────────────
function genSchoolDays(s,e){
  const d=new Date(s+'T00:00:00'),end=new Date(e+'T00:00:00'),r=[];
  while(d<=end){const w=d.getDay();if(w>0&&w<6)r.push(d.toISOString().slice(0,10));d.setDate(d.getDate()+1);}
  return r;
}
const ALL_DAYS=genSchoolDays('2026-10-05','2026-11-09');

// ── Attendance data (single source of truth) ──────────────────────
const ATT={};
ALL_DAYS.forEach(date=>{
  ATT[date]={};
  CLASSES.forEach(cls=>{
    if(date===TODAY&&UNCALLED.includes(cls.id))return;
    ATT[date][cls.id]={};
    STUDENTS[cls.id].forEach((stu,si)=>{
      const prob=si<3; // first 3 per class = higher absence/late rate
      const r=rnd();
      let st;
      if(prob){
        if     (r<0.35)st='A';
        else if(r<0.55)st='L';
        else           st='P';
      }else{
        if     (r<0.04)st='A';
        else if(r<0.07)st='L';
        else if(r<0.09)st='E';
        else           st='P';
      }
      ATT[date][cls.id][stu.id]=st;
    });
  });
});

// ── Stats functions (ALL derived from ATT — numbers always match) ──
function dayStats(cid,date){
  const d=ATT[date]?.[cid];if(!d)return null;
  let P=0,A=0,L=0,E=0;
  Object.values(d).forEach(s=>{if(s==='P')P++;else if(s==='A')A++;else if(s==='L')L++;else E++;});
  const tot=P+A+L+E;
  return{P,A,L,E,tot,rate:tot?Math.round((P+L+E)/tot*100):0};
}
function rangeStats(cid,days){
  let P=0,A=0,L=0,E=0,called=0;
  days.forEach(d=>{const s=dayStats(cid,d);if(!s)return;P+=s.P;A+=s.A;L+=s.L;E+=s.E;called++;});
  const tot=P+A+L+E;
  return{P,A,L,E,tot,rate:tot?Math.round((P+L+E)/tot*100):0,called};
}
function stuRecs(sid,cid,days){
  return days.map(d=>({date:d,st:ATT[d]?.[cid]?.[sid]})).filter(r=>r.st!==undefined);
}
function stuMonthStats(sid,cid,month){
  const days=ALL_DAYS.filter(d=>d.startsWith(month));
  const recs=stuRecs(sid,cid,days);
  let P=0,A=0,L=0,E=0;
  recs.forEach(r=>{if(r.st==='P')P++;else if(r.st==='A')A++;else if(r.st==='L')L++;else E++;});
  return{P,A,L,E,recs};
}
function stuAllStats(sid,cid){
  const recs=stuRecs(sid,cid,ALL_DAYS);
  let P=0,A=0,L=0,E=0;
  recs.forEach(r=>{if(r.st==='P')P++;else if(r.st==='A')A++;else if(r.st==='L')L++;else E++;});
  return{P,A,L,E,recs};
}
function overLimitList(month){
  const list=[];
  CLASSES.forEach(cls=>STUDENTS[cls.id].forEach(stu=>{
    const ms=stuMonthStats(stu.id,cls.id,month);
    const as=stuAllStats(stu.id,cls.id);
    if(ms.A>=ABS_THRESH||ms.L>=LAT_THRESH)
      list.push({sid:stu.id,cid:cls.id,name:stu.name,no:stu.no,
        mA:ms.A,mL:ms.L,mP:ms.P,mE:ms.E,tA:as.A,tL:as.L,
        absOvr:ms.A>=ABS_THRESH,latOvr:ms.L>=LAT_THRESH});
  }));
  return list.sort((a,b)=>(b.mA+b.mL)-(a.mA+a.mL));
}
function todayKPI(){
  let P=0,A=0,L=0,E=0;
  CLASSES.forEach(cls=>{
    if(UNCALLED.includes(cls.id))return;
    const s=dayStats(cls.id,TODAY);if(!s)return;
    P+=s.P;A+=s.A;L+=s.L;E+=s.E;
  });
  const tot=P+A+L+E;
  return{P,A,L,E,tot,rate:tot?Math.round((P+L+E)/tot*100):0};
}

// ── Helpers ───────────────────────────────────────────────────────
function fDate(d){
  const dt=new Date(d+'T00:00:00');
  return`${dt.getMonth()+1}/${dt.getDate()} (${'日一二三四五六'[dt.getDay()]})`;
}
function fMonth(m){const[y,mo]=m.split('-');return`${y}年${+mo}月`;}
function rc(r){return r>=90?'hi':r>=75?'md':'lo';}
function gCls(id){return CLASSES.find(c=>c.id===id);}
function gStu(sid,cid){return STUDENTS[cid]?.find(s=>s.id===sid);}
function fillBar(r){return`<div class="rate-bar"><div class="rate-fill" style="width:${r}%;background:${r>=90?'var(--pos)':r>=75?'var(--yellow)':'var(--neg)'}"></div></div>`;}

// ── State ─────────────────────────────────────────────────────────
let activeTab='cls';
let filterMonth=document.getElementById('monthFilter').value;
let filterClass='';

// ── Render: Alert ─────────────────────────────────────────────────
function renderAlert(){
  const el=document.getElementById('alertBan');
  if(!UNCALLED.length){
    el.innerHTML=`<div class="alrt-ban ok"><span class="alrt-ico">✅</span><div class="alrt-body"><div class="alrt-title">全部班別今日已完成點名</div></div></div>`;
    return;
  }
  const called=CLASSES.filter(c=>!UNCALLED.includes(c.id));
  el.innerHTML=`<div class="alrt-ban warn">
    <span class="alrt-ico">⚠️</span>
    <div class="alrt-body">
      <div class="alrt-title">今日尚有 ${UNCALLED.length} 個班別未完成點名 — 以下班別數據不計入今日統計</div>
      <div class="alrt-chips">
        ${UNCALLED.map(id=>`<span class="chip chip-r">❌ ${gCls(id)?.name}</span>`).join('')}
        ${called.map(c=>`<span class="chip chip-g">✓ ${c.name}</span>`).join('')}
      </div>
    </div>
  </div>`;
}

// ── Render: KPI ───────────────────────────────────────────────────
function renderKPI(){
  const k=todayKPI();
  const ovl=overLimitList(filterMonth);
  document.getElementById('kpiRow').innerHTML=`
    <div class="kpi"><div class="kpi-lbl">今日出席率</div>
      <div class="kpi-val ${rc(k.rate)}">${k.rate}%</div>
      <div class="kpi-sub">${k.P+k.L+k.E} / ${k.tot} 人到校</div></div>
    <div class="kpi"><div class="kpi-lbl">未點名班別</div>
      <div class="kpi-val ${UNCALLED.length>0?'r':'g'}">${UNCALLED.length}</div>
      <div class="kpi-sub">共 ${CLASSES.length} 個班別</div></div>
    <div class="kpi"><div class="kpi-lbl">今日缺席</div>
      <div class="kpi-val r">${k.A}</div><div class="kpi-sub">人次</div></div>
    <div class="kpi"><div class="kpi-lbl">今日遲到</div>
      <div class="kpi-val y">${k.L}</div><div class="kpi-sub">人次</div></div>
    <div class="kpi"><div class="kpi-lbl">本月超標學生</div>
      <div class="kpi-val r">${ovl.length}</div>
      <div class="kpi-sub">缺≥${ABS_THRESH} 或遲≥${LAT_THRESH}</div></div>
  `;
}

// ── Render: 班別總覽 ───────────────────────────────────────────────
function renderCls(){
  const days=ALL_DAYS.filter(d=>d.startsWith(filterMonth));
  const cls=filterClass?CLASSES.filter(c=>c.id===filterClass):CLASSES;
  let tP=0,tA=0,tL=0,tE=0;
  const rows=cls.map(c=>{
    const s=rangeStats(c.id,days);
    const unCall=UNCALLED.includes(c.id);
    tP+=s.P;tA+=s.A;tL+=s.L;tE+=s.E;
    return`<tr class="clk" onclick="openClsModal('${c.id}')">
      <td><strong>${c.name}</strong>${unCall?'<span class="ol ol-a" style="margin-left:5px">今日未點名</span>':''}</td>
      <td class="c">${STUDENTS[c.id].length}</td>
      <td class="c" style="color:var(--pos);font-weight:700">${s.P}</td>
      <td class="c" style="color:var(--neg);font-weight:700">${s.A}</td>
      <td class="c" style="color:var(--yellow);font-weight:700">${s.L}</td>
      <td class="c" style="color:#93C5FD;font-weight:700">${s.E}</td>
      <td class="c" style="color:var(--muted)">${s.called}</td>
      <td><span class="pct ${rc(s.rate)}">${s.rate}%</span>${fillBar(s.rate)}</td>
    </tr>`;
  }).join('');
  const tTot=tP+tA+tL+tE,tRate=tTot?Math.round((tP+tL+tE)/tTot*100):0;
  document.getElementById('pane-cls').innerHTML=`<div class="sec">
    <div class="shdr"><h3>🏫 班別出席總覽</h3>
      <span style="font-size:11px;color:var(--muted)">${fMonth(filterMonth)} · ${days.length} 個學習日</span>
    </div>
    <div class="tbl-wrap"><table class="mt">
      <thead><tr><th>班別</th><th class="c">學生數</th>
        <th class="c" style="color:var(--pos)">出席</th>
        <th class="c" style="color:var(--neg)">缺席</th>
        <th class="c" style="color:var(--yellow)">遲到</th>
        <th class="c" style="color:#93C5FD">有事假</th>
        <th class="c">點名日數</th><th>出席率</th></tr></thead>
      <tbody>${rows}
        <tr style="border-top:2px solid var(--border);font-weight:600;background:rgba(30,45,66,.3)">
          <td>全部合計</td>
          <td class="c">${CLASSES.reduce((s,c)=>s+STUDENTS[c.id].length,0)}</td>
          <td class="c" style="color:var(--pos)">${tP}</td>
          <td class="c" style="color:var(--neg)">${tA}</td>
          <td class="c" style="color:var(--yellow)">${tL}</td>
          <td class="c" style="color:#93C5FD">${tE}</td>
          <td class="c" style="color:var(--muted)">—</td>
          <td><span class="pct ${rc(tRate)}">${tRate}%</span>${fillBar(tRate)}</td>
        </tr>
      </tbody>
    </table></div>
    <div class="foot-note">💡 點擊班別行查看該班每位學生本月出席詳情</div>
  </div>`;
}

// ── Render: 日出席率 ───────────────────────────────────────────────
function renderDay(){
  const days=ALL_DAYS.filter(d=>d.startsWith(filterMonth));
  const cls=filterClass?CLASSES.filter(c=>c.id===filterClass):CLASSES;
  const hds=cls.map(c=>`<th class="c">${c.name}</th>`).join('');
  const rows=days.map(date=>{
    let P=0,A=0,L=0,E=0;
    const cells=cls.map(c=>{
      const s=dayStats(c.id,date);
      if(!s)return`<td class="c"><span style="font-size:10px;color:var(--muted)">—</span></td>`;
      P+=s.P;A+=s.A;L+=s.L;E+=s.E;
      return`<td class="c"><span class="pct ${rc(s.rate)}">${s.rate}%</span></td>`;
    }).join('');
    const tot=P+A+L+E,oRate=tot?Math.round((P+L+E)/tot*100):0;
    const isToday=date===TODAY;
    return`<tr${isToday?' style="background:rgba(36,160,90,.05)"':''}>
      <td style="white-space:nowrap;${isToday?'color:var(--yellow);font-weight:700':''}">${fDate(date)}${isToday?' ◀':''}</td>
      ${cells}
      <td class="c"><span class="pct ${rc(oRate)}">${oRate}%</span></td>
      <td class="c" style="color:var(--neg)">${A}</td>
      <td class="c" style="color:var(--yellow)">${L}</td>
    </tr>`;
  }).join('');
  document.getElementById('pane-day').innerHTML=`<div class="sec">
    <div class="shdr"><h3>📅 逐日出席率</h3>
      <span style="font-size:11px;color:var(--muted)">${fMonth(filterMonth)} · ${days.length} 天</span>
    </div>
    <div class="tbl-wrap"><table class="mt">
      <thead><tr><th>日期</th>${hds}<th class="c">整體</th>
        <th class="c" style="color:var(--neg)">缺席</th>
        <th class="c" style="color:var(--yellow)">遲到</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <div class="foot-note">▲ 今日 — 格顯示未點名班別</div>
  </div>`;
}

// ── Render: 月出席率 ───────────────────────────────────────────────
function renderMon(){
  const cls=filterClass?CLASSES.filter(c=>c.id===filterClass):CLASSES;
  const mHds=MONTHS.map(m=>`<th class="c">${fMonth(m)}</th>`).join('');
  const rows=cls.map(c=>{
    const mStats=MONTHS.map(m=>rangeStats(c.id,ALL_DAYS.filter(d=>d.startsWith(m))));
    const all=rangeStats(c.id,ALL_DAYS);
    const mCells=mStats.map(s=>`<td class="c">
      <span class="pct ${rc(s.rate)}">${s.rate}%</span><br>
      <span style="font-size:10px;color:var(--muted)">缺${s.A} 遲${s.L}</span>
    </td>`).join('');
    return`<tr>
      <td><strong>${c.name}</strong></td>
      ${mCells}
      <td class="c"><span class="pct ${rc(all.rate)}">${all.rate}%</span></td>
      <td class="c" style="color:var(--neg);font-weight:700">${all.A}</td>
      <td class="c" style="color:var(--yellow);font-weight:700">${all.L}</td>
    </tr>`;
  }).join('');
  document.getElementById('pane-mon').innerHTML=`<div class="sec">
    <div class="shdr"><h3>📆 月出席率對比</h3>
      <span style="font-size:11px;color:var(--muted)">2026年10月 – 11月</span>
    </div>
    <div class="tbl-wrap"><table class="mt">
      <thead><tr><th>班別</th>${mHds}
        <th class="c">整體出席率</th>
        <th class="c" style="color:var(--neg)">總缺席</th>
        <th class="c" style="color:var(--yellow)">總遲到</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <div class="foot-note">出席率 = (出席 + 遲到 + 有事假) ÷ 總人次 × 100%</div>
  </div>`;
}

// ── Render: 超標名單 ───────────────────────────────────────────────
function renderOvl(){
  const list=overLimitList(filterMonth);
  const filtered=filterClass?list.filter(s=>s.cid===filterClass):list;
  if(!filtered.length){
    document.getElementById('pane-ovl').innerHTML=`<div class="sec">
      <div class="shdr"><h3>🚨 超標名單</h3></div>
      <div class="empty">✅ ${fMonth(filterMonth)}暫無學生超過缺席或遲到上限</div>
    </div>`;
    return;
  }
  const rows=filtered.map(s=>`<tr class="clk" onclick="openStuModal('${s.sid}','${s.cid}')">
    <td>${gCls(s.cid)?.name}</td>
    <td style="font-weight:600">${s.name}</td>
    <td class="c" style="font-size:11px;color:var(--muted)">${s.no}</td>
    <td class="c" style="color:${s.absOvr?'var(--neg)':'inherit'};font-weight:${s.absOvr?700:400}">
      ${s.mA}${s.absOvr?`<span style="font-size:10px"> ≥${ABS_THRESH}⚠</span>`:''}
    </td>
    <td class="c" style="color:${s.latOvr?'var(--yellow)':'inherit'};font-weight:${s.latOvr?700:400}">
      ${s.mL}${s.latOvr?`<span style="font-size:10px"> ≥${LAT_THRESH}⚠</span>`:''}
    </td>
    <td class="c" style="color:var(--muted)">${s.tA}</td>
    <td class="c" style="color:var(--muted)">${s.tL}</td>
    <td>${s.absOvr?'<span class="ol ol-a">缺席超標</span>':''}${s.latOvr?'<span class="ol ol-l">遲到超標</span>':''}</td>
  </tr>`).join('');
  document.getElementById('pane-ovl').innerHTML=`<div class="sec">
    <div class="shdr">
      <h3>🚨 超標名單</h3>
      <span style="font-size:11px;color:var(--muted)">${fMonth(filterMonth)}</span>
      <span style="font-size:11px;background:rgba(239,68,68,.1);color:#FCA5A5;border:1px solid rgba(239,68,68,.2);padding:2px 9px;border-radius:20px;margin-left:4px">${filtered.length} 人</span>
      <div class="shdr-r" style="font-size:11px;color:var(--muted)">缺席≥${ABS_THRESH}次 或 遲到≥${LAT_THRESH}次 / 月</div>
    </div>
    <div class="tbl-wrap"><table class="mt">
      <thead><tr><th>班別</th><th>姓名</th><th class="c">學號</th>
        <th class="c" style="color:var(--neg)">本月缺席</th>
        <th class="c" style="color:var(--yellow)">本月遲到</th>
        <th class="c">全期缺席</th><th class="c">全期遲到</th>
        <th>狀態</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <div class="foot-note">💡 點擊學生行 → 查看逐日記錄 — 數字與記錄完全對應，可逐筆核實</div>
  </div>`;
}

// ── Modal: Class detail ────────────────────────────────────────────
function openClsModal(cid){
  const cls=gCls(cid);
  const days=ALL_DAYS.filter(d=>d.startsWith(filterMonth));
  const rows=STUDENTS[cid].map(stu=>{
    const recs=stuRecs(stu.id,cid,days);
    let P=0,A=0,L=0,E=0;
    recs.forEach(r=>{if(r.st==='P')P++;else if(r.st==='A')A++;else if(r.st==='L')L++;else E++;});
    const tot=P+A+L+E,rate=tot?Math.round((P+L+E)/tot*100):0;
    const ao=A>=ABS_THRESH,lo=L>=LAT_THRESH;
    return`<tr class="clk" onclick="openStuModal('${stu.id}','${cid}')">
      <td style="color:var(--muted);font-size:11px">${stu.no}</td>
      <td style="font-weight:600">${stu.name}${ao?'<span class="ol ol-a" style="margin-left:4px">缺超</span>':''}${lo?'<span class="ol ol-l" style="margin-left:2px">遲超</span>':''}</td>
      <td class="c" style="color:var(--pos)">${P}</td>
      <td class="c" style="color:${ao?'var(--neg)':'inherit'};font-weight:${ao?700:400}">${A}</td>
      <td class="c" style="color:${lo?'var(--yellow)':'inherit'};font-weight:${lo?700:400}">${L}</td>
      <td class="c" style="color:#93C5FD">${E}</td>
      <td class="c"><span class="pct ${rc(rate)}">${rate}%</span></td>
    </tr>`;
  }).join('');
  document.getElementById('modTitle').textContent=`${cls.name} · ${fMonth(filterMonth)} 學生出席`;
  document.getElementById('modBody').innerHTML=`
    <div class="m-info">班別：<strong>${cls.name}</strong> &nbsp; 月份：<strong>${fMonth(filterMonth)}</strong> &nbsp; 學習日：<strong>${days.length} 天</strong></div>
    <div class="tbl-wrap"><table class="mt">
      <thead><tr><th>號</th><th>姓名</th>
        <th class="c" style="color:var(--pos)">出席</th>
        <th class="c" style="color:var(--neg)">缺席</th>
        <th class="c" style="color:var(--yellow)">遲到</th>
        <th class="c" style="color:#93C5FD">事假</th>
        <th class="c">出席率</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <div style="margin-top:8px;font-size:11px;color:var(--muted)">點擊學生查看逐日明細</div>`;
  document.getElementById('modal').classList.remove('hide');
}

// ── Modal: Student detail (proves numbers match records) ──────────
function openStuModal(sid,cid){
  const stu=gStu(sid,cid),cls=gCls(cid);
  const allRecs=stuRecs(sid,cid,ALL_DAYS);
  const monDays=ALL_DAYS.filter(d=>d.startsWith(filterMonth));
  const monRecs=stuRecs(sid,cid,monDays);
  let mP=0,mA=0,mL=0,mE=0;
  monRecs.forEach(r=>{if(r.st==='P')mP++;else if(r.st==='A')mA++;else if(r.st==='L')mL++;else mE++;});
  let tP=0,tA=0,tL=0,tE=0;
  allRecs.forEach(r=>{if(r.st==='P')tP++;else if(r.st==='A')tA++;else if(r.st==='L')tL++;else tE++;});
  const mTot=mP+mA+mL+mE,mRate=mTot?Math.round((mP+mL+mE)/mTot*100):0;

  // Build record rows — ALL from same stuRecs() source used for stats
  const recRows=allRecs.slice().reverse().map(r=>{
    const isMon=r.date.startsWith(filterMonth);
    return`<tr${isMon?' style="background:rgba(36,160,90,.04)"':''}>
      <td style="white-space:nowrap;font-family:monospace;font-size:12px;${isMon?'font-weight:600':''}">${r.date}</td>
      <td style="font-size:11px;color:var(--muted)">${fDate(r.date).match(/\(.+\)/)?.[0]||''}</td>
      <td class="c"><span class="sb sb-${r.st}">${STATUS_LABEL[r.st]}</span></td>
      <td style="font-size:10px;color:${isMon?'var(--gl)':'transparent'}">${isMon?'● 本月':''}</td>
    </tr>`;
  }).join('');

  document.getElementById('modTitle').textContent=`${stu.name} · 出席記錄核實`;
  document.getElementById('modBody').innerHTML=`
    <div class="m-info">
      姓名：<strong>${stu.name}</strong> &nbsp; 班別：<strong>${cls.name}</strong> &nbsp; 學號：<strong>${stu.no}</strong>
    </div>
    <div class="m-kpi-row">
      <div class="m-kpi"><div class="m-kpi-val" style="color:var(--pos)">${mP}</div><div class="m-kpi-lbl">本月出席</div></div>
      <div class="m-kpi"><div class="m-kpi-val" style="color:var(--neg)">${mA}</div><div class="m-kpi-lbl">本月缺席</div></div>
      <div class="m-kpi"><div class="m-kpi-val" style="color:var(--yellow)">${mL}</div><div class="m-kpi-lbl">本月遲到</div></div>
      <div class="m-kpi"><div class="m-kpi-val" style="color:#93C5FD">${mE}</div><div class="m-kpi-lbl">本月事假</div></div>
      <div class="m-kpi"><div class="m-kpi-val ${rc(mRate)}">${mRate}%</div><div class="m-kpi-lbl">本月出席率</div></div>
      <div class="m-kpi"><div class="m-kpi-val" style="color:var(--muted)">${tA}</div><div class="m-kpi-lbl">全期缺席</div></div>
      <div class="m-kpi"><div class="m-kpi-val" style="color:var(--muted)">${tL}</div><div class="m-kpi-lbl">全期遲到</div></div>
    </div>
    <div class="verify-note">
      ✅ 以下共 <strong>${allRecs.length}</strong> 筆記錄（綠底 = 本月 <strong>${monRecs.length}</strong> 筆）
      — 本月缺席 <strong>${mA}</strong> 筆、遲到 <strong>${mL}</strong> 筆，與上方數字完全一致
    </div>
    <div class="tbl-wrap"><table class="mt">
      <thead><tr><th>日期</th><th>星期</th><th class="c">狀態</th><th></th></tr></thead>
      <tbody>${recRows}</tbody>
    </table></div>`;
  document.getElementById('modal').classList.remove('hide');
}

function closeMod(){document.getElementById('modal').classList.add('hide');}

// ── Export Excel ──────────────────────────────────────────────────
function doExport(){
  if(typeof XLSX==='undefined'){doCSV();return;}
  const wb=XLSX.utils.book_new();
  const m=filterMonth,days=ALL_DAYS.filter(d=>d.startsWith(m));

  // Sheet 1: 班別總覽
  const s1=[['班別','學生數','出席','缺席','遲到','有事假','點名日數','出席率(%)']];
  CLASSES.forEach(c=>{const s=rangeStats(c.id,days);s1.push([c.name,STUDENTS[c.id].length,s.P,s.A,s.L,s.E,s.called,s.rate]);});
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(s1),'班別總覽');

  // Sheet 2: 日出席率
  const s2=[['日期',...CLASSES.map(c=>c.name+' 出席率%'),'整體出席率%','缺席人次','遲到人次']];
  days.forEach(date=>{
    let P=0,A=0,L=0,E=0;
    const rc2=CLASSES.map(c=>{const s=dayStats(c.id,date);if(!s)return'未點名';P+=s.P;A+=s.A;L+=s.L;E+=s.E;return s.rate;});
    const tot=P+A+L+E;s2.push([date,...rc2,tot?Math.round((P+L+E)/tot*100):0,A,L]);
  });
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(s2),'日出席率');

  // Sheet 3: 超標名單
  const s3=[['班別','姓名','學號','本月缺席','本月遲到','全期缺席','全期遲到','缺席超標','遲到超標']];
  overLimitList(m).forEach(s=>s3.push([gCls(s.cid)?.name,s.name,s.no,s.mA,s.mL,s.tA,s.tL,s.absOvr?'是':'否',s.latOvr?'是':'否']));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(s3),'超標名單');

  // Sheet 4: 原始記錄 (audit trail — numbers verifiable)
  const s4=[['日期','班別','學生姓名','學號','狀態']];
  ALL_DAYS.forEach(date=>CLASSES.forEach(c=>{
    const d=ATT[date]?.[c.id];if(!d)return;
    STUDENTS[c.id].forEach(stu=>{if(d[stu.id])s4.push([date,c.name,stu.name,stu.no,STATUS_LABEL[d[stu.id]]]);});
  }));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(s4),'原始記錄');

  XLSX.writeFile(wb,`D-03_點名統計_${m}.xlsx`);
  toast('📥',`Excel 已匯出（4 頁工作表）：D-03_點名統計_${m}.xlsx`);
}

function doCSV(){
  const days=ALL_DAYS.filter(d=>d.startsWith(filterMonth));
  let csv='\uFEFF班別,學生數,出席,缺席,遲到,有事假,出席率\n';
  CLASSES.forEach(c=>{const s=rangeStats(c.id,days);csv+=`${c.name},${STUDENTS[c.id].length},${s.P},${s.A},${s.L},${s.E},${s.rate}%\n`;});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));
  a.download=`D-03_點名統計_${filterMonth}.csv`;a.click();
  toast('📥','CSV 已匯出（XLSX 未載入，改以 CSV 格式）');
}

// ── Tab switch ────────────────────────────────────────────────────
function switchTab(t){
  activeTab=t;
  ['cls','day','mon','ovl'].forEach(x=>{
    document.getElementById('pane-'+x).style.display=x===t?'':'none';
    document.getElementById('tab-'+x).classList.toggle('on',x===t);
  });
  renderPane(t);
}
function renderPane(t){
  if     (t==='cls')renderCls();
  else if(t==='day')renderDay();
  else if(t==='mon')renderMon();
  else if(t==='ovl')renderOvl();
}
function onFilter(){
  filterMonth=document.getElementById('monthFilter').value;
  filterClass=document.getElementById('classFilter').value;
  renderKPI();renderPane(activeTab);
}

// ── Toast ─────────────────────────────────────────────────────────
function toast(ico,msg){
  const el=document.getElementById('toast');
  document.getElementById('tIco').textContent=ico;
  document.getElementById('tMsg').textContent=msg;
  el.classList.add('on');clearTimeout(el._t);
  el._t=setTimeout(()=>el.classList.remove('on'),3800);
}

// ── Init ──────────────────────────────────────────────────────────
(function init(){
  const t0=performance.now();
  // Populate class dropdown
  const cf=document.getElementById('classFilter');
  CLASSES.forEach(c=>{const o=document.createElement('option');o.value=c.id;o.textContent=c.name;cf.appendChild(o);});
  // Full render
  renderAlert();renderKPI();renderCls();
  const ms=(performance.now()-t0).toFixed(1);
  document.getElementById('renderMs').textContent=`⚡ 渲染耗時 ${ms} ms`;
  document.title=`點名統計 D-03 · ${TODAY}`;
})();
</script>
