<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T-06 · Timetable</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang HK', sans-serif;
            background: #f7f7f5;
            color: #1a1a1a;
            min-height: 100vh;
        }

        /* Header */
        .header {
            background: #1a1a1a;
            color: white;
            padding: 18px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }
        .header-left { display: flex; align-items: center; gap: 14px; }
        .logo { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: #d4ff6e; }
        .header-title { font-size: 15px; font-weight: 600; }
        .header-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

        .class-select {
            background: #2a2a2a;
            color: white;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 13px;
            cursor: pointer;
            outline: none;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: opacity 0.2s;
            white-space: nowrap;
        }
        .btn:hover { opacity: 0.8; }
        .btn-excel { background: #22c55e; color: white; }
        .btn-pdf   { background: #ef4444; color: white; }

        /* Main */
        .main { padding: 24px; max-width: 1100px; margin: 0 auto; }

        .table-wrap {
            background: white;
            border-radius: 16px;
            border: 1px solid #e8e8e8;
            overflow: hidden;
            overflow-x: auto;
        }

        table { width: 100%; border-collapse: collapse; min-width: 580px; }

        thead th {
            background: #1a1a1a;
            color: white;
            padding: 13px 10px;
            font-size: 12px;
            font-weight: 600;
            text-align: center;
            letter-spacing: 0.03em;
        }
        thead th.col-time { width: 88px; background: #111; }
        thead th .sub { font-weight: 400; font-size: 10px; color: #888; display: block; margin-top: 2px; }

        td { border: 1px solid #f0f0f0; vertical-align: middle; }

        td.time-cell {
            background: #fafafa;
            padding: 10px 10px;
            text-align: center;
            border-color: #f0f0f0;
        }
        .time-label { font-size: 11px; font-weight: 700; color: #1a1a1a; display: block; }
        .time-range { font-size: 10px; color: #bbb; display: block; margin-top: 2px; line-height: 1.5; }

        tr.break-row td {
            background: #f7f7f5;
            border-color: #ebebeb;
            text-align: center;
            color: #c0c0c0;
            font-size: 11px;
            padding: 7px 10px;
            letter-spacing: 0.05em;
        }

        .cell-btn {
            width: 100%;
            min-height: 68px;
            padding: 10px 10px;
            background: transparent;
            border: none;
            cursor: pointer;
            text-align: center;
            transition: background 0.15s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
        }
        .cell-btn:hover { background: #f0f6ff; }
        .cell-btn.empty:hover { background: #f9f9f9; }

        .cell-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
            vertical-align: middle;
            flex-shrink: 0;
        }
        .cell-subject { font-size: 13px; font-weight: 600; color: #1a1a1a; }
        .cell-teacher { font-size: 11px; color: #888; }
        .cell-room    { font-size: 10px; color: #bbb; }
        .cell-empty   { font-size: 20px; color: #e0e0e0; }

        /* Modal */
        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .overlay.active { display: flex; }

        .modal {
            background: white;
            border-radius: 20px;
            padding: 32px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.18);
        }
        .modal-title    { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
        .modal-sub      { font-size: 12px; color: #999; margin-bottom: 24px; }
        .form-label     { font-size: 11px; font-weight: 600; color: #666; margin-bottom: 6px; display: block; letter-spacing: 0.04em; }
        .form-group     { margin-bottom: 14px; }
        .form-input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
            font-family: inherit;
        }
        .form-input:focus { border-color: #1a1a1a; }

        .modal-actions { display: flex; gap: 8px; margin-top: 22px; }
        .btn-cancel { flex: 1; background: #f0f0f0; color: #777; }
        .btn-clear  { flex: 1; background: #fff0f0; color: #ef4444; }
        .btn-save   { flex: 2; background: #1a1a1a; color: white; }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 24px; right: 24px;
            background: #1a1a1a;
            color: white;
            padding: 11px 18px;
            border-radius: 10px;
            font-size: 13px;
            transform: translateY(60px);
            opacity: 0;
            transition: all 0.3s;
            z-index: 200;
            pointer-events: none;
        }
        .toast.show { transform: translateY(0); opacity: 1; }

        /* Print */
        @media print {
            .no-print { display: none !important; }
            body { background: white; }
            .main { padding: 0; max-width: 100%; }
            .table-wrap { border: none; border-radius: 0; }
            .cell-btn:hover { background: transparent; }
        }

        @media (max-width: 520px) {
            .header { padding: 14px 16px; }
            .main   { padding: 14px; }
        }
    </style>
</head>
<body>

<div class="header">
    <div class="header-left">
        <span class="logo">T-06</span>
        <span class="header-title">時間表管理 · Timetable</span>
    </div>
    <div class="header-right no-print">
        <select class="class-select" id="classSelect" onchange="changeClass()">
            <option value="1A">Class 1A</option>
            <option value="1B">Class 1B</option>
            <option value="2A">Class 2A</option>
            <option value="2B">Class 2B</option>
        </select>
        <button class="btn btn-excel" onclick="exportCSV()">↓ Excel</button>
        <button class="btn btn-pdf"   onclick="exportPDF()">↓ PDF</button>
    </div>
</div>

<div class="main">
    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th class="col-time">時間</th>
                    <th>星期一<span class="sub">Monday</span></th>
                    <th>星期二<span class="sub">Tuesday</span></th>
                    <th>星期三<span class="sub">Wednesday</span></th>
                    <th>星期四<span class="sub">Thursday</span></th>
                    <th>星期五<span class="sub">Friday</span></th>
                </tr>
            </thead>
            <tbody id="tbody"></tbody>
        </table>
    </div>
</div>

<!-- Modal -->
<div class="overlay" id="overlay">
    <div class="modal">
        <div class="modal-title">編輯課節</div>
        <div class="modal-sub" id="modalSub"></div>
        <div class="form-group">
            <label class="form-label">科目 SUBJECT</label>
            <input class="form-input" id="iSubject" placeholder="例：數學、英文、中文...">
        </div>
        <div class="form-group">
            <label class="form-label">老師 TEACHER</label>
            <input class="form-input" id="iTeacher" placeholder="例：Chan Sir、Wong Miss...">
        </div>
        <div class="form-group">
            <label class="form-label">課室 ROOM</label>
            <input class="form-input" id="iRoom" placeholder="例：101、Hall、Lab...">
        </div>
        <div class="modal-actions">
            <button class="btn btn-cancel" onclick="closeModal()">取消</button>
            <button class="btn btn-clear"  onclick="clearCell()">清除</button>
            <button class="btn btn-save"   onclick="saveCell()">儲存</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

let currentClass = '1A';
let editing = null;

function render() {
    const tbody = document.getElementById('tbody');
    tbody.innerHTML = '';
    const classData = DATA[currentClass];

    PERIODS.forEach(p => {
        const tr = document.createElement('tr');

        if (p.isBreak) {
            tr.classList.add('break-row');
            const td = document.createElement('td');
            td.colSpan = 6;
            td.textContent = `${p.label}　${p.start} – ${p.end}`;
            tr.appendChild(td);
        } else {
            // Time cell
            const tdTime = document.createElement('td');
            tdTime.className = 'time-cell';
            tdTime.innerHTML = `<span class="time-label">${p.label}</span><span class="time-range">${p.start}<br>${p.end}</span>`;
            tr.appendChild(tdTime);

            // Day cells
            DAYS.forEach(day => {
                const td = document.createElement('td');
                const cell = classData[p.id] && classData[p.id][day];
                const btn = document.createElement('button');
                btn.className = 'cell-btn' + (cell ? '' : ' empty');
                btn.onclick = () => openModal(p.id, day, p.label);

                if (cell) {
                    const color = getColor(cell.subject);
                    btn.innerHTML = `
                        <span class="cell-subject"><span class="cell-dot" style="background:${color}"></span>${cell.subject}</span>
                        <span class="cell-teacher">${cell.teacher}</span>
                        <span class="cell-room">${cell.room}</span>`;
                } else {
                    btn.innerHTML = `<span class="cell-empty">＋</span>`;
                }
                td.appendChild(btn);
                tr.appendChild(td);
            });
        }

        tbody.appendChild(tr);
    });
}

function changeClass() {
    currentClass = document.getElementById('classSelect').value;
    render();
}

function openModal(periodId, day, label) {
    editing = { periodId, day };
    const classData = DATA[currentClass];
    const cell = classData[periodId] && classData[periodId][day];
    document.getElementById('modalSub').textContent = `${currentClass}  ·  ${label}  ·  ${DAY_NAMES[day]}`;
    document.getElementById('iSubject').value = cell ? cell.subject : '';
    document.getElementById('iTeacher').value = cell ? cell.teacher : '';
    document.getElementById('iRoom').value    = cell ? cell.room    : '';
    document.getElementById('overlay').classList.add('active');
    setTimeout(() => document.getElementById('iSubject').focus(), 50);
}

function closeModal() {
    document.getElementById('overlay').classList.remove('active');
    editing = null;
}

function saveCell() {
    if (!editing) return;
    const subject = document.getElementById('iSubject').value.trim();
    const teacher = document.getElementById('iTeacher').value.trim();
    const room    = document.getElementById('iRoom').value.trim();
    if (!subject) { showToast('請輸入科目名稱'); return; }
    const { periodId, day } = editing;
    if (!DATA[currentClass][periodId]) DATA[currentClass][periodId] = {};
    DATA[currentClass][periodId][day] = { subject, teacher, room };
    closeModal();
    render();
    showToast('已儲存 ✓');
}

function clearCell() {
    if (!editing) return;
    const { periodId, day } = editing;
    if (DATA[currentClass][periodId]) delete DATA[currentClass][periodId][day];
    closeModal();
    render();
    showToast('已清除');
}

function exportCSV() {
    const classData = DATA[currentClass];
    const dayNames  = ['星期一','星期二','星期三','星期四','星期五'];
    let csv = `Class ${currentClass} 時間表\n節次,時間,${dayNames.join(',')}\n`;

    PERIODS.forEach(p => {
        if (p.isBreak) {
            csv += `,"${p.label} ${p.start}–${p.end}",,,,\n`;
            return;
        }
        let row = `${p.label},${p.start}-${p.end}`;
        DAYS.forEach(day => {
            const cell = classData[p.id] && classData[p.id][day];
            row += cell ? `,"${cell.subject} / ${cell.teacher} / ${cell.room}"` : ',';
        });
        csv += row + '\n';
    });

    const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Timetable_${currentClass}.csv`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('Excel 匯出完成 ✓');
}

function exportPDF() {
    window.print();
}

function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2400);
}

document.getElementById('overlay').addEventListener('click', e => {
    if (e.target === document.getElementById('overlay')) closeModal();
});
document.addEventListener('keydown', e => {
    if (e.key === 'Enter'  && document.getElementById('overlay').classList.contains('active')) saveCell();
    if (e.key === 'Escape') closeModal();
});

render();
</script>
</body>
</html>
