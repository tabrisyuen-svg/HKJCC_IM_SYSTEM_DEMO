/* ═══ AI GENERATION ENGINE ═══ */
function genEmoji(str){
  for(const[re,e]of EMOJI_MAP)if(re.test(str))return e;
  return['🌟','🎯','💡','🏫','🚀','✨'][Math.floor(Math.random()*6)];
}
function genColorIdx(str){
  const cm=[[/藍|科|技|電|程|IT/,0],[/紫|學|習|研|專/,1],[/綠|環|義|運|體|服/,2],[/黃|閱|書|讀|金/,3],[/紅|愛|心|關|懷/,4],[/橙|比|賽|冠|競/,5],[/青|遊|旅|藝|參/,6],[/粉|家|親|活|CCA/,7]];
  for(const[re,i]of cm)if(re.test(str))return i;
  return Math.floor(Math.random()*8);
}
function genFeatures(n,d){
  const fb={閱:['目標設定','進度追蹤','老師審批','積分聯動'],義:['時數記錄','機構確認','成就系統','活動管理'],比:['報名管理','資格審查','成績記錄','頒獎系統'],遊:['節點管理','家長確認','費用追蹤','多方協作'],體:['出席追蹤','成績記錄','表現評分','成就頒發'],獎:['加減積分','排行榜','兌換系統','歷史記錄']};
  const s=n+(d||'');
  for(const[k,v]of Object.entries(fb))if(s.includes(k))return v;
  return['進度追蹤','通知系統','報告匯出','權限管理'];
}
function genDocs(n){
  const dm=[[/報名|登記/,['報名表']],[/收費|費用/,['收費記錄','收據']],[/護照|身份/,['護照副本','身份證副本']],[/保險/,['保險單']],[/報告|成果/,['活動報告']],[/同意|家長/,['家長同意書']]];
  const docs=[];for(const[re,d]of dm)if(re.test(n))docs.push(...d);
  return docs;
}
function detectType(r){
  if(r._type==='template'){
    const m={'📚':'閱讀學習','❤️':'義工服務','🥇':'比賽管理','✈️':'遊學活動','🎵':'音樂藝術','🎨':'藝術創作','🔬':'科學探究','⚽':'體育活動','🎓':'學術研習','🏆':'獎勵激勵','👨‍👩‍👧':'家長參與','⚡':'課外活動','🌿':'環保教育','💻':'資訊科技'};
    return m[r.e]||'一般計劃';
  }
  if(/報名|收費/.test(r.n))return'行政管理';
  if(/護照|文件/.test(r.n))return'資料收集';
  if(/活動|服務/.test(r.n))return'活動節點';
  return'一般任務';
}

    const ci=genColorIdx(input.n+(input.d||''));
    const co=COLOR_OPTS[ci];
    return{_type:'template',id:'ai_'+Date.now(),n:input.n,e:genEmoji(input.n+(input.d||'')),d:input.d||'由 AI 智能分析生成的計劃範本',f:input.f?input.f.split(/[,，、\s]+/).filter(Boolean):genFeatures(input.n,input.d),a:0,...co,conf:Math.floor(88+Math.random()*10)};
  }
  return{_type:type,id:Date.now(),n:input.n,dl:input.dl||'',p:input.p||'',st:'pending',docs:genDocs(input.n),note:input.note||'',conf:Math.floor(90+Math.random()*9)};
}

function oAIMod(type,tplId=null){
  if(aiTimer){clearInterval(aiTimer);aiTimer=null;}
  S.aiModal=true;S.aiStep='input';S.aiType=type;S.aiTplId=tplId;
  S.aiInput={n:'',d:'',f:'',dl:'',p:'',note:''};S.aiLog=[];S.aiProgress=0;
  rAIMod();
}
function cAIMod(){
  if(aiTimer){clearInterval(aiTimer);aiTimer=null;}
  S.aiModal=false;document.getElementById('M').innerHTML='';
}
function startAIThink(skip){
  if(!skip&&!S.aiInput.n.trim()){ntf('請先輸入名稱！','err');return;}
  if(aiTimer){clearInterval(aiTimer);aiTimer=null;}
  S.aiStep='thinking';S.aiLog=[];S.aiProgress=0;
  rAIMod();
  const total=3200+Math.random()*5300,start=Date.now(),msgDelay=total/AI_MSGS.length;
  aiTimer=setInterval(()=>{
    const el=Date.now()-start,pct=el/total;
    const prog=Math.min(96,100*(1-Math.exp(-3.5*pct)));
    S.aiProgress=prog;
    const msgCount=Math.min(AI_MSGS.length,Math.floor(el/msgDelay)+1);
    if(S.aiLog.length<msgCount){
      while(S.aiLog.length<msgCount)S.aiLog.push(AI_MSGS[S.aiLog.length]);
      const logEl=document.getElementById('ai-log');
      if(logEl){
        logEl.innerHTML=S.aiLog.map((m,i)=>{
          const done=i<S.aiLog.length-1;
          return`<div class="lln" style="display:flex;align-items:center;gap:.5rem;padding:3px 0;font-family:'SF Mono',Consolas,monospace;font-size:11.5px;line-height:1.65">
            <span style="color:${done?'#22c55e':'#4ade80'};flex-shrink:0;font-size:10px">${done?'✓':'›'}</span>
            <span style="color:${done?'#4b5563':'#d1fae5'};flex:1">${m}</span>
            ${done?'':`<span class="cur" style="color:#4ade80">▌</span>`}
          </div>`;
        }).join('');
        logEl.scrollTop=logEl.scrollHeight;
      }
    }
    const pe=document.getElementById('ai-prog'),pte=document.getElementById('ai-pct');
    if(pe)pe.style.width=prog+'%';
    if(pte)pte.textContent=Math.floor(prog)+'%';
    if(el>=total){
      clearInterval(aiTimer);aiTimer=null;
      if(pe)pe.style.width='100%';if(pte)pte.textContent='100%';
      setTimeout(()=>{S.aiStep='result';S.aiResult=genResult(S.aiType,S.aiInput);rAIMod();},400);
    }
  },120);
}
function regenAI(){startAIThink(true);}
function doConfirmAI(){
  const r=S.aiResult;
  if(r._type==='template'){
    const{_type,conf,...td}=r;
    S.CT.push(td);S.TK[td.id]=[];
    cAIMod();S.tab='tasks';S.tplDetail=td.id;S.tkF='all';
    render();ntf('✨「'+td.n+'」AI 範本建立完成！');
  }else if(r._type==='node'){
    S.ND=[...S.ND,{id:r.id,n:r.n,dl:r.dl,st:'pending',p:r.p,docs:r.docs,note:r.note}];
    cAIMod();render();ntf('✨ 節點「'+r.n+'」AI 建立完成！');
  }else if(r._type==='task'){
    if(!S.TK[S.aiTplId])S.TK[S.aiTplId]=[];
    S.TK[S.aiTplId].push({id:r.id,n:r.n,dl:r.dl,p:r.p,st:'pending'});
    cAIMod();render();ntf('✨ 任務「'+r.n+'」AI 建立完成！');
  }
}

  </div>
  <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5 overflow-x-auto">
    <div style="min-width:700px">
      <div class="flex mb-3">
        <div style="width:180px;flex-shrink:0" class="text-xs font-medium text-gray-400 uppercase tracking-wide">計劃名稱</div>
        <div class="flex-1 flex">${MONTHS.map(m=>`<div class="flex-1 text-xs text-gray-300 text-center border-l border-gray-100 pb-1">${m}</div>`).join('')}</div>

      ${GP.map(p=>{const tt=TT.find(t=>t.id===p.t);const wp=Math.max(((p.e-p.s)/T)*100,2);const lp=(p.s/T)*100;return`
      <div class="flex items-center mb-3">
        <div style="width:180px;flex-shrink:0" class="flex items-center gap-2 pr-3">
          <span style="font-size:12px">${tt?tt.e:'📋'}</span>
          <span class="text-xs text-gray-700 truncate">${p.n}</span>
        </div>
        <div class="flex-1 relative" style="height:36px">
          <div class="absolute inset-0 flex">${MONTHS.map(()=>`<div class="flex-1 border-l border-gray-50"></div>`).join('')}</div>
          <div class="gbar" title="${p.n}" style="left:${lp}%;width:${wp}%;background:${p.c}22;border:1.5px solid ${p.c}60;color:${p.c}">${p.n}</div>
        </div>
        <div style="width:80px;flex-shrink:0" class="pl-3">
          <span class="text-xs px-2 py-0.5 rounded-full ${p.st==='active'?'bg-green-100 text-green-600':p.st==='completed'?'bg-gray-100 text-gray-500':'bg-amber-100 text-amber-600'}">

    <div class="flex flex-wrap gap-4">${TT.map(t=>`<div class="flex items-center gap-1.5"><div class="w-3 h-3 rounded-sm" style="background:${t.c}"></div><span class="text-xs text-gray-500">${t.n}</span></div>`).join('')}</div>
  </div>
</div>`;}

          <thead class="bg-gray-50"><tr>${['計劃名稱','類型','開始','結束','進度','負責人','狀態'].map(h=>`<th class="text-left text-xs font-medium text-gray-400 px-5 py-3">${h}</th>`).join('')}</tr></thead>
          <tbody>${[

            {n:'籃球隊 2024-25',t:'課外活動',s:'9月',e:'6月',p:60,l:'李老師',st:'active'},

          </tr>`).join('')}</tbody>

/* ═══ POINTS MODAL ═══ */
function rMod(){
  if(S.aiModal){
    if(S.aiStep==='thinking'&&document.getElementById('ai-log'))return;
    rAIMod();return;
  }
  if(!S.modal){document.getElementById('M').innerHTML='';return;}
  const pre=['默書滿分','積極參與','協助同學','比賽獲獎','遲交功課','違反規則'];
  const ok=S.selS&&S.ptA&&S.ptR;
  document.getElementById('M').innerHTML=`
  <div class="mo" onclick="cMod()">
    <div class="mb" onclick="event.stopPropagation()">
      <div class="flex items-center justify-between mb-5">
        <h3 class="font-bold text-gray-900 text-lg">調整積分</h3>
        <button onclick="cMod()" style="border:none;background:none;cursor:pointer;width:30px;height:30px;border-radius:8px;font-size:16px;color:#9ca3af" class="hover:bg-gray-100">✕</button>
      </div>
      <div class="flex gap-2 mb-5">
        <button onclick="sPT('add')" class="flex-1 py-2.5 rounded-xl text-sm font-medium border cursor-pointer ${S.ptT==='add'?'bg-green-50 text-green-700 border-green-200':'bg-gray-50 text-gray-500 border-gray-200'}">➕ 加分</button>
        <button onclick="sPT('subtract')" class="flex-1 py-2.5 rounded-xl text-sm font-medium border cursor-pointer ${S.ptT==='subtract'?'bg-red-50 text-red-700 border-red-200':'bg-gray-50 text-gray-500 border-gray-200'}">➖ 扣分</button>
      </div>
      <div class="mb-5">
        <label class="text-sm font-medium text-gray-700 mb-2 block">選擇學生</label>
        <div class="grid grid-cols-3 gap-2">
          ${S.stus.map(s=>`
          <button onclick="sSel(${s.id})" class="p-2.5 rounded-xl border text-center cursor-pointer ${S.selS===s.id?'border-blue-400 bg-blue-50':'border-gray-200 hover:bg-gray-50'}">
            <div class="text-xl mb-0.5">${s.e}</div>
            <div class="text-xs font-medium text-gray-800">${s.n}</div>
            <div class="text-xs text-gray-400">${s.pts}分</div>
          </button>`).join('')}
        </div>
      </div>
      <div class="mb-5">
        <label class="text-sm font-medium text-gray-700 mb-2 block">積分數量</label>
        <div class="flex gap-2">
          <input id="ptA" type="number" value="${S.ptA}" oninput="S.ptA=this.value" placeholder="輸入積分" class="flex-1 border border-gray-200 rounded-xl px-3 py-2.5 text-sm" style="outline:none">
          ${[10,20,50].map(v=>`<button onclick="S.ptA='${v}';document.getElementById('ptA').value='${v}'" class="px-3 py-2.5 bg-gray-100 text-gray-700 rounded-xl text-sm hover:bg-gray-200 font-medium cursor-pointer">${v}</button>`).join('')}
        </div>
      </div>
      <div class="mb-5">
        <label class="text-sm font-medium text-gray-700 mb-2 block">原因</label>
        <div class="flex flex-wrap gap-1.5 mb-2">
          ${pre.map(r=>`<button onclick="sPR('${r}')" class="text-xs px-2.5 py-1.5 rounded-lg border cursor-pointer ${S.ptR===r?'border-blue-400 bg-blue-50 text-blue-700':'border-gray-200 text-gray-600 hover:bg-gray-50'}">${r}</button>`).join('')}
        </div>
        <input id="ptR" type="text" value="${S.ptR}" oninput="S.ptR=this.value" placeholder="或自行輸入原因..." class="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm" style="outline:none">
      </div>
      <button onclick="doPts()" ${!ok?'disabled':''}
        class="w-full py-3 rounded-xl font-medium text-sm ${ok?(S.ptT==='add'?'bg-green-500 hover:bg-green-600 text-white cursor-pointer':'bg-red-500 hover:bg-red-600 text-white cursor-pointer'):'bg-gray-100 text-gray-400 cursor-not-allowed'}">
        確認${S.ptT==='add'?'加分':'扣分'}
      </button>
    </div>
  </div>`;}

/* ═══ MAIN RENDER ═══ */
function render(){
  let c='';
  if(S.tab==='dashboard')c=rDash();
  else if(S.tab==='tasks')c=rTasks();
  else if(S.tab==='rewards_tab')c=rRewards();
  else if(S.tab==='nodes')c=rNodes();
  else if(S.tab==='gantt')c=rGantt();
  else if(S.tab==='reports')c=rRpts();
  else c=rDash();

  document.getElementById('A').innerHTML=`
  <div class="flex-shrink-0 bg-white border-b border-gray-100 px-5 py-3 flex items-center justify-between z-30" style="backdrop-filter:blur(8px)">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 bg-blue-600 rounded-xl flex items-center justify-center text-white font-bold text-sm">M</div>
      <span class="font-bold text-gray-900 text-sm">任務系統 Demo</span>
      <span class="text-xs bg-blue-100 text-blue-600 px-2 py-0.5 rounded-full font-medium">M-01</span>
      <span class="text-xs bg-purple-100 text-purple-600 px-2 py-0.5 rounded-full font-semibold">✨ AI 驅動</span>
    </div>
    <div class="flex items-center gap-1 bg-gray-100 rounded-xl p-1">
      ${RL.map(r=>`<button onclick="gRole('${r.id}')" class="rb flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium ${S.role===r.id?'on':'text-gray-500 hover:text-gray-700'}">${r.e} ${r.l}</button>`).join('')}
    </div>
    <div class="flex items-center gap-2">
      <button onclick="ntf('你有 3 個待辦通知！')" class="relative p-2 hover:bg-gray-100 rounded-xl text-base">
        🔔<span style="position:absolute;top:4px;right:4px;width:8px;height:8px;background:#ef4444;border-radius:50%"></span>
      </button>
      <div class="w-8 h-8 rounded-full flex items-center justify-center text-white text-sm" style="background:linear-gradient(135deg,#3b82f6,#4f46e5)">👤</div>
    </div>
  </div>
  <div class="flex flex-1 overflow-hidden">
    <div class="flex-shrink-0 bg-white border-r border-gray-100 p-4 flex flex-col" style="width:208px">
      <nav class="space-y-1 flex-1">
        ${NV.map(n=>`<button onclick="gTab('${n.id}')" class="nb w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium ${S.tab===n.id?'on':'text-gray-600 hover:bg-gray-50 hover:text-gray-900'}">${n.e} ${n.l}</button>`).join('')}
      </nav>
      <div class="pt-4 border-t border-gray-100 space-y-2">
        ${ce()?`<button onclick="oAIMod('template')" class="aibtn w-full flex items-center justify-center gap-1.5 px-3 py-2 text-white rounded-xl text-xs font-bold">✨ AI 生成計劃</button>`:''}
        <div class="px-3 py-3 bg-gray-50 rounded-xl">
          <p class="text-xs font-semibold text-gray-700">${RL.find(r=>r.id===S.role)?.l}</p>
          <p class="text-xs text-gray-400 mt-0.5 leading-relaxed">${RL.find(r=>r.id===S.role)?.h}</p>
        </div>
      </div>
    </div>
    <div class="flex-1 overflow-y-auto p-6">
      <div class="tf">${c}</div>
    </div>
  </div>`;

  if(S.tab==='reports')setTimeout(initCharts,80);
  rMod();
}

/* ═══ HANDLERS ═══ */
function gTab(t){if(t!=='tasks')S.tplDetail=null;S.tab=t;render();}
function gRole(r){S.role=r;render();}
function cType(id){
  if(id==='rewards')gTab('rewards_tab');
  else if(id==='studytour')gTab('nodes');
  else{if(!S.TK[id])S.TK[id]=[];S.tplDetail=id;S.tkF='all';S.tab='tasks';render();}
}
function sRS(t){S.rSub=t;render();}
function sRF(f){S.rF=f;render();}
function sSS(id){S.shopS=parseInt(id);render();}
function tgN(id){S.exN=S.exN===id?null:id;render();}
function oMod(sid=null){S.modal=true;S.selS=sid;S.ptA='';S.ptR='';S.ptT='add';rMod();}
function cMod(){S.modal=false;document.getElementById('M').innerHTML='';}
function sPT(t){S.ptT=t;rMod();}
function sSel(id){S.selS=id;rMod();}
function sPR(r){S.ptR=r;const el=document.getElementById('ptR');if(el)el.value=r;rMod();}
function doPts(){
  const amt=parseInt(S.ptA);if(!S.selS||!amt||amt<=0||!S.ptR.trim())return;
  const stu=S.stus.find(s=>s.id===S.selS);if(!stu)return;
  const pt=S.ptT;
  S.stus=S.stus.map(s=>s.id===S.selS?{...s,pts:pt==='add'?s.pts+amt:Math.max(0,s.pts-amt)}:s);
  S.txns=[{id:Date.now(),n:stu.n,sid:stu.id,t:pt,a:amt,r:S.ptR.trim(),by:S.role==='teacher'?'老師':'管理員',tm:'剛剛'},...S.txns];
  cMod();render();ntf((pt==='add'?'已加 ':'已扣 ')+amt+' 積分 ✓');
}
function dRdm(stuId,itemId){
  const stu=S.stus.find(s=>s.id===stuId);const item=SH.find(i=>i.id===itemId);
  if(!stu||!item)return;
  if(stu.pts<item.c){ntf('積分不足！','err');return;}
  S.stus=S.stus.map(s=>s.id===stuId?{...s,pts:s.pts-item.c}:s);
  S.txns=[{id:Date.now(),n:stu.n,sid:stu.id,t:'redeem',a:item.c,r:'兌換'+item.n,by:'System',tm:'剛剛'},...S.txns];
  render();ntf(stu.n+' 成功兌換 '+item.n+'！');
}
function tkgSt(tplId,taskId){
  if(!S.TK[tplId])return;
  S.TK[tplId]=S.TK[tplId].map(t=>t.id===taskId?{...t,st:TK_CYCLE[t.st]}:t);render();
}
function tkDel(tplId,taskId){
  if(!S.TK[tplId])return;
  S.TK[tplId]=S.TK[tplId].filter(t=>t.id!==taskId);render();
}
function ndgSt(id){
  S.ND=S.ND.map(n=>n.id===id?{...n,st:TK_CYCLE[n.st]}:n);
  render();ntf('節點狀態已更新！');
}
function ndDel(id){
  S.ND=S.ND.filter(n=>n.id!==id);if(S.exN===id)S.exN=null;
  render();ntf('節點已刪除！');
}

render();
</script>
