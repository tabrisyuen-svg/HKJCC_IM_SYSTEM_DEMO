<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>陳南昌紀念學校 · 管理系統</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --green:#1B6E3C;--gl:#24A05A;--yellow:#F5C518;
  --dark:#0D1B2A;--card:#162032;--card2:#1E2D42;
  --border:#2A3D55;--text:#E8EDF3;--muted:#7A90A8;
}
body{font-family:'Segoe UI','Microsoft JhengHei',sans-serif;background:var(--dark);color:var(--text);min-height:100vh;overflow:hidden;}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* ── TOP BAR ── */
.topbar{
  position:fixed;top:0;left:0;right:0;z-index:300;
  height:58px;background:#07101A;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 16px;gap:0;
}
.mob-toggle{
  display:none;width:34px;height:34px;border-radius:8px;
  background:var(--card2);border:1px solid var(--border);
  align-items:center;justify-content:center;
  cursor:pointer;font-size:16px;flex-shrink:0;margin-right:10px;
}
.logo-wrap{
  display:flex;align-items:center;gap:10px;
  padding-right:20px;border-right:1px solid var(--border);
  margin-right:14px;flex-shrink:0;
}
.logo-badge{
  width:36px;height:36px;border-radius:9px;
  background:var(--green);
  display:flex;align-items:center;justify-content:center;
  font-weight:900;color:var(--yellow);font-size:14px;
}
.logo-txt h2{font-size:10.5px;color:var(--yellow);font-weight:700;white-space:nowrap;}
.logo-txt p{font-size:9px;color:var(--muted);margin-top:2px;white-space:nowrap;}

.main-nav{display:flex;gap:3px;flex:1;}
.nav-tab{
  display:flex;align-items:center;gap:6px;
  padding:8px 14px;border-radius:8px;
  cursor:pointer;font-size:13px;font-weight:600;
  color:var(--muted);transition:all .2s;
  user-select:none;white-space:nowrap;
}
.nav-tab:hover{background:var(--card2);color:var(--text);}
.nav-tab.active{background:var(--green);color:#fff;}
.nav-tab.active .ni{color:var(--yellow);}
.ni{font-size:15px;}
.coming-chip{
  font-size:9px;padding:2px 6px;border-radius:10px;
  background:rgba(122,144,168,.12);color:var(--muted);
}

.top-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-shrink:0;}
.notif-btn{
  width:34px;height:34px;border-radius:8px;
  background:var(--card2);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:14px;position:relative;
}
.notif-dot{
  position:absolute;top:7px;right:7px;
  width:6px;height:6px;background:#EF4444;
  border-radius:50%;border:1.5px solid #07101A;
}
.user-chip{
  display:flex;align-items:center;gap:8px;
  padding:5px 10px;background:var(--card2);
  border:1px solid var(--border);border-radius:8px;cursor:pointer;
}
.user-av{
  width:27px;height:27px;border-radius:50%;
  background:var(--green);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;flex-shrink:0;
}
.user-name{font-size:12px;font-weight:600;}
.user-role{font-size:10px;color:var(--muted);}

/* ── LAYOUT ── */
.body-wrap{
  display:flex;
  margin-top:58px;
  height:calc(100vh - 58px);
  overflow:hidden;
}

/* ── LEFT SIDEBAR ── */
.sidebar{
  width:220px;
  flex-shrink:0;
  background:#09141F;
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  overflow-y:auto;
  z-index:200;
  transition:transform .3s;
}
.sb-sec{display:none;flex-direction:column;flex:1;}
.sb-sec.on{display:flex;}
.sb-hdr{padding:14px 14px 10px;border-bottom:1px solid var(--border);}
.sb-hdr-tag{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:700;}
.sb-hdr-name{font-size:13px;font-weight:700;color:var(--text);margin-top:4px;}
.sb-nav{padding:8px;}
.sb-item{
  display:flex;align-items:center;gap:9px;
  padding:9px 10px;border-radius:8px;
  cursor:pointer;font-size:13px;color:var(--muted);
  transition:all .2s;margin-bottom:2px;
  border:1px solid transparent;
}
.sb-item:hover{background:var(--card2);color:var(--text);}
.sb-item.on{background:rgba(27,110,60,.2);color:#4ADE80;border-color:rgba(27,110,60,.3);}
.sb-item.on .si{color:var(--yellow);}
.si{font-size:15px;width:20px;text-align:center;flex-shrink:0;}
.sb-badge{
  margin-left:auto;font-size:9px;font-weight:700;
  padding:2px 7px;border-radius:10px;
}
.bd-done{background:rgba(34,197,94,.15);color:#22C55E;}
.bd-wip{background:rgba(122,144,168,.1);color:var(--muted);}
.sb-cs{
  display:none;flex-direction:column;
  align-items:center;justify-content:center;
  flex:1;padding:32px 20px;text-align:center;gap:12px;
}
.sb-cs.on{display:flex;}
.sb-cs-ico{font-size:36px;opacity:.25;}
.sb-cs p{font-size:12px;color:var(--muted);line-height:1.8;}

/* ── MAIN AREA ── */
.main{
  flex:1;
  min-width:0;
  height:100%;
  position:relative;
  overflow:hidden;
}

/* ── DASHBOARD VIEW ── */
#dashboard-view{
  position:absolute;inset:0;
  overflow-y:auto;
  padding:24px;
  display:block;
}
#dashboard-view::-webkit-scrollbar{width:5px}
#dashboard-view::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* ── IFRAME VIEW ── */
#iframe-view{
  position:absolute;inset:0;
  display:none;
}
#iframe-view iframe{
  width:100%;
  height:100%;
  border:none;
  display:block;
}

/* ── COMING SOON VIEW ── */
#cs-view{
  position:absolute;inset:0;
  display:none;
  flex-direction:column;
  align-items:center;justify-content:center;
  text-align:center;gap:16px;
  padding:32px;
  overflow-y:auto;
}
.cs-ico{font-size:64px;opacity:.2;}
.cs-title{font-size:22px;font-weight:700;color:var(--muted);}
.cs-sub{font-size:13px;color:var(--muted);max-width:340px;line-height:1.8;}
.cs-pill{background:rgba(245,197,24,.1);border:1px solid rgba(245,197,24,.2);color:var(--yellow);padding:7px 20px;border-radius:20px;font-size:12px;font-weight:700;letter-spacing:.5px;}

/* ── IFRAME LOADING OVERLAY ── */
.iframe-loader{
  position:absolute;inset:0;
  background:var(--dark);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:14px;z-index:10;
  transition:opacity .3s;
}
.iframe-loader.hide{opacity:0;pointer-events:none;}
.loader-ring{
  width:40px;height:40px;
  border:3px solid var(--border);
  border-top-color:var(--gl);
  border-radius:50%;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loader-txt{font-size:13px;color:var(--muted);}
.loader-code{font-size:11px;color:var(--yellow);font-weight:700;}

/* ── DASHBOARD STYLES ── */
.breadcrumb{
  display:flex;align-items:center;gap:6px;
  font-size:11px;color:var(--muted);margin-bottom:18px;
}
.breadcrumb strong{color:var(--text);font-weight:500;}
.dash-hello{margin-bottom:18px;}
.dash-hello h1{font-size:21px;font-weight:700;}
.dash-hello h1 em{color:var(--yellow);font-style:normal;}
.dash-hello p{font-size:12px;color:var(--muted);margin-top:4px;}

.qs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:11px;margin-bottom:20px;}
.qs-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:12px;padding:15px 14px;position:relative;overflow:hidden;
}
.qs-card::after{content:'';position:absolute;top:0;left:0;right:0;height:3px;}
.qc-g::after{background:var(--gl);}
.qc-y::after{background:var(--yellow);}
.qc-b::after{background:#3B82F6;}
.qc-r::after{background:#EF4444;}
.qc-p::after{background:#8B5CF6;}
.qs-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
.qs-num{font-size:26px;font-weight:700;margin:5px 0 3px;line-height:1;}
.qs-sub{font-size:11px;color:var(--muted);}
.qs-ico{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-size:26px;opacity:.1;}

.sec-ttl{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px;}

.mod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:12px;margin-bottom:22px;}
.mod-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:12px;padding:16px;
  cursor:pointer;transition:all .18s;
  display:flex;flex-direction:column;gap:10px;
}
.mod-card:hover{border-color:var(--gl);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.3);}
.mod-card.dim{opacity:.5;cursor:default;}
.mod-card.dim:hover{border-color:var(--border);transform:none;box-shadow:none;}
.mod-row{display:flex;align-items:center;gap:10px;}
.mod-ico{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.mi-g{background:rgba(27,110,60,.25);}
.mi-b{background:rgba(59,130,246,.2);}
.mi-y{background:rgba(245,197,24,.2);}
.mi-p{background:rgba(139,92,246,.2);}
.mod-info h4{font-size:14px;font-weight:600;}
.mod-info p{font-size:11px;color:var(--muted);margin-top:1px;}
.mod-code{margin-left:auto;font-size:10px;color:var(--yellow);font-weight:700;}
.mod-desc{font-size:12px;color:var(--muted);line-height:1.6;}
.mod-pill{align-self:flex-start;font-size:10px;font-weight:600;padding:3px 10px;border-radius:20px;}
.pill-done{background:rgba(34,197,94,.12);color:#22C55E;}
.pill-wip{background:rgba(122,144,168,.1);color:var(--muted);}

.act-card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.act-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid rgba(42,61,85,.4);font-size:13px;}
.act-row:last-child{border-bottom:none;}
.act-ico{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
.act-bd{flex:1;}
.act-bd strong{display:block;font-size:13px;font-weight:500;}
.act-bd span{display:block;font-size:11px;color:var(--muted);margin-top:2px;}
.act-time{font-size:11px;color:var(--muted);flex-shrink:0;}

/* ── MOBILE ── */
.mob-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:190;}
@media(max-width:900px){
  .sidebar{position:fixed;top:58px;bottom:0;left:0;transform:translateX(-220px);}
  .sidebar.open{transform:none;}
}
@media(max-width:640px){
  #dashboard-view{padding:14px;}
  .logo-txt{display:none;}
  .user-name,.user-role{display:none;}
  .coming-chip{display:none;}
  .nav-tab{padding:8px 10px;font-size:12px;}
}
</style>
</head>
<body>

<!-- ── TOP BAR ── -->
<header class="topbar">
  <button class="mob-toggle" id="mobToggle">☰</button>
  <div class="logo-wrap">
    <div class="logo-badge">陳</div>
    <div class="logo-txt">
      <h2>陳南昌紀念學校</h2>
      <p>Chan Nam Cheong Memorial School</p>
    </div>
  </div>
  <nav class="main-nav">
    <div class="nav-tab active" data-tab="student" onclick="switchTab('student')">
      <span class="ni">👤</span>學生
    </div>
    <div class="nav-tab" data-tab="skills" onclick="switchTab('skills')">
      <span class="ni">⭐</span>技能系統<span class="coming-chip">即將推出</span>
    </div>
    <div class="nav-tab" data-tab="ai" onclick="switchTab('ai')">
      <span class="ni">🤖</span>AI 教練<span class="coming-chip">即將推出</span>
    </div>
    <div class="nav-tab" data-tab="admin" onclick="switchTab('admin')">
      <span class="ni">⚙️</span>管理<span class="coming-chip">即將推出</span>
    </div>
  </nav>
  <div class="top-right">
    <div class="notif-btn">🔔<span class="notif-dot"></span></div>
    <div class="user-chip">
      <div class="user-av">李</div>
      <div>
        <div class="user-name">李老師</div>
        <div class="user-role">班主任 · 中二 2A</div>
      </div>
    </div>
  </div>
</header>

<!-- ── BODY ── -->
<div class="body-wrap">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sb-sec on" id="sb-student">
      <div class="sb-hdr">
        <div class="sb-hdr-tag">SECTION</div>
        <div class="sb-hdr-name">學生管理</div>
      </div>
      <nav class="sb-nav">
        <div class="sb-item on" data-page="dashboard" onclick="switchPage('dashboard')">
          <span class="si">🏠</span>總覽
        </div>
        <div class="sb-item" data-page="profile" onclick="switchPage('profile')">
          <span class="si">👤</span>學生檔案
          <span class="sb-badge bd-done">D-01</span>
        </div>
        <div class="sb-item" data-page="attendance" onclick="switchPage('attendance')">
          <span class="si">📋</span>點名系統
          <span class="sb-badge bd-done">D-02</span>
        </div>
        <div class="sb-item" data-page="report" onclick="switchPage('report')">
          <span class="si">📊</span>出席統計報告
          <span class="sb-badge bd-wip">即將</span>
        </div>
        <div class="sb-item" data-page="parent" onclick="switchPage('parent')">
          <span class="si">📞</span>家長通訊記錄
          <span class="sb-badge bd-wip">即將</span>
        </div>
      </nav>
    </div>
    <div class="sb-cs" id="sb-skills">
      <div class="sb-cs-ico">⭐</div>
      <p><strong style="color:var(--text)">技能系統</strong><br>即將推出</p>
    </div>
    <div class="sb-cs" id="sb-ai">
      <div class="sb-cs-ico">🤖</div>
      <p><strong style="color:var(--text)">AI 教練</strong><br>即將推出</p>
    </div>
    <div class="sb-cs" id="sb-admin">
      <div class="sb-cs-ico">⚙️</div>
      <p><strong style="color:var(--text)">管理</strong><br>即將推出</p>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">

    <!-- 1. DASHBOARD VIEW -->
    <div id="dashboard-view"></div>

    <!-- 2. IFRAME VIEW -->
    <div id="iframe-view">
      <div class="iframe-loader" id="iframeLoader">
        <div class="loader-ring"></div>
        <div class="loader-code" id="loaderCode">D-01</div>
        <div class="loader-txt" id="loaderTxt">載入中…</div>
      </div>
      <iframe id="mainFrame" title="功能視窗"></iframe>
    </div>

    <!-- 3. COMING SOON VIEW -->
    <div id="cs-view">
      <div class="cs-ico" id="csIco">🚧</div>
      <div class="cs-title" id="csTitle">即將推出</div>
      <div class="cs-sub" id="csSub">功能開發中，敬請期待。</div>
      <span class="cs-pill">Coming Soon</span>
    </div>

  </main>
</div>

<div class="mob-overlay" id="mobOverlay" onclick="closeSidebar()"></div>

<script>
/* ── CONFIG: iframe 頁面對應 ── */
const IFRAME_PAGES = {
  profile:    { src: 'Student/D_01_StudentProfile.html', code: 'D-01', label: '學生檔案' },
  attendance: { src: 'Student/D_02_Attendance.html',     code: 'D-02', label: '點名系統' },
};

const CS_PAGES = {
  report: { ico:'📊', title:'出席統計報告', sub:'班級整體出席率、月度趨勢圖表、個別學生報告，開發中，敬請期待。' },
  parent: { ico:'📞', title:'家長通訊記錄', sub:'家長聯絡記錄、缺席通知發送、溝通歷史存檔，開發中，敬請期待。' },
};

const TAB_CS = {
  skills: { ico:'⭐', title:'技能系統即將推出', sub:'加減分、行為記錄、技能評分功能正在開發中，敬請期待。' },
  ai:     { ico:'🤖', title:'AI 教練即將推出', sub:'班級整體分析、個別學生建議、異常預警功能正在開發中。' },
  admin:  { ico:'⚙️', title:'管理功能即將推出', sub:'班別管理、老師帳號、匯入匯出、權限管理功能正在開發中。' },
};

let curTab = 'student', curPage = 'dashboard';

/* ── VIEW SWITCHER ── */
function showView(v) {
  document.getElementById('dashboard-view').style.display = v==='dashboard' ? 'block' : 'none';
  document.getElementById('iframe-view').style.display    = v==='iframe'    ? 'block' : 'none';
  document.getElementById('cs-view').style.display        = v==='cs'        ? 'flex'  : 'none';
}

/* ── LOAD IFRAME ── */
function loadIframe(page) {
  const cfg = IFRAME_PAGES[page];
  const frame = document.getElementById('mainFrame');
  const loader = document.getElementById('iframeLoader');
  document.getElementById('loaderCode').textContent = cfg.code;
  document.getElementById('loaderTxt').textContent  = `載入 ${cfg.label}…`;
  loader.classList.remove('hide');
  frame.src = '';
  showView('iframe');
  // small delay for visual feedback
  setTimeout(() => {
    frame.onload = () => loader.classList.add('hide');
    frame.src = cfg.src;
  }, 120);
}

/* ── COMING SOON ── */
function showCS(ico, title, sub) {
  document.getElementById('csIco').textContent   = ico;
  document.getElementById('csTitle').textContent = title;
  document.getElementById('csSub').textContent   = sub;
  showView('cs');
}

/* ── BUILD DASHBOARD ── */
function buildDashboard() {
  const d = new Date();
  const days = ['日','一','二','三','四','五','六'];
  const ds = `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（星期${days[d.getDay()]}）`;
  document.getElementById('dashboard-view').innerHTML = `
<div class="breadcrumb"><span>學生</span><span>›</span><strong>總覽</strong></div>
<div class="dash-hello">
  <h1>你好，<em>李老師</em> 👋</h1>
  <p>${ds} · 中二 2A 班主任</p>
</div>
<div class="qs-grid">
  <div class="qs-card qc-g"><div class="qs-lbl">總學生人數</div><div class="qs-num" style="color:#4ADE80">15</div><div class="qs-sub">中二 2A</div><div class="qs-ico">👤</div></div>
  <div class="qs-card qc-y"><div class="qs-lbl">今日出席率</div><div class="qs-num" style="color:var(--yellow)">—</div><div class="qs-sub">點名未完成</div><div class="qs-ico">📋</div></div>
  <div class="qs-card qc-b"><div class="qs-lbl">本月出席率</div><div class="qs-num" style="color:#93C5FD">—</div><div class="qs-sub">資料不足</div><div class="qs-ico">📊</div></div>
  <div class="qs-card qc-r"><div class="qs-lbl">需跟進個案</div><div class="qs-num" style="color:#FCA5A5">0</div><div class="qs-sub">今日</div><div class="qs-ico">⚑</div></div>
  <div class="qs-card qc-p"><div class="qs-lbl">家長通知待發</div><div class="qs-num" style="color:#C4B5FD">0</div><div class="qs-sub">待發送</div><div class="qs-ico">📞</div></div>
</div>
<div class="sec-ttl">功能模組</div>
<div class="mod-grid">
  <div class="mod-card" onclick="switchPage('profile')">
    <div class="mod-row"><div class="mod-ico mi-g">👤</div><div class="mod-info"><h4>學生檔案</h4><p>個人資料管理</p></div><div class="mod-code">D-01</div></div>
    <div class="mod-desc">學生個人資料、聯絡資訊、學業與行為記錄。</div>
    <span class="mod-pill pill-done">✅ 已完成</span>
  </div>
  <div class="mod-card" onclick="switchPage('attendance')">
    <div class="mod-row"><div class="mod-ico mi-g">📋</div><div class="mod-info"><h4>點名系統</h4><p>出席記錄</p></div><div class="mod-code">D-02</div></div>
    <div class="mod-desc">上午 / 下午點名，六種出席狀態，備注、家長通知、鎖定。</div>
    <span class="mod-pill pill-done">✅ 已完成</span>

/* ── NAV ── */
function switchTab(tab) {
  curTab = tab;
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  ['student','skills','ai','admin'].forEach(s => {
    document.getElementById('sb-' + s).classList.remove('on');
  });
  document.getElementById('sb-' + tab).classList.add('on');

  if (tab === 'student') {
    renderStudentPage(curPage);
  } else {
    const cs = TAB_CS[tab];
    showCS(cs.ico, cs.title, cs.sub);
  }
  closeSidebar();
}

function switchPage(page) {
  curPage = page;
  document.querySelectorAll('#sb-student .sb-item').forEach(i => i.classList.toggle('on', i.dataset.page === page));
  renderStudentPage(page);
  closeSidebar();
}

function renderStudentPage(page) {
  if (page === 'dashboard') {
    buildDashboard();
  } else if (IFRAME_PAGES[page]) {
    loadIframe(page);
  } else if (CS_PAGES[page]) {
    const cs = CS_PAGES[page];
    showCS(cs.ico, cs.title, cs.sub);
  }
}

/* ── MOBILE ── */
document.getElementById('mobToggle').addEventListener('click', () => {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('mobOverlay').style.display = 'block';
});
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('mobOverlay').style.display = 'none';
}

/* ── INIT ── */
buildDashboard();
