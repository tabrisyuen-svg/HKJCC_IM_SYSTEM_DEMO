<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>教學資源管理 · T-01</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --green:#1B6E3C;--green-light:#24A05A;--yellow:#F5C518;
  --dark:#0D1B2A;--card:#162032;--card2:#1E2D42;
  --border:#2A3D55;--text:#E8EDF3;--muted:#7A90A8;
  --red:#EF4444;--blue:#3B82F6;--purple:#8B5CF6;
}
body{font-family:'Segoe UI','Microsoft JhengHei',sans-serif;background:var(--dark);color:var(--text);min-height:100vh;}
.main{padding:24px;min-height:100vh;}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
.topbar h1{font-size:20px;font-weight:700;}
.topbar h1 span{color:var(--yellow);}
.badge-demo{background:var(--yellow);color:#000;font-size:10px;font-weight:700;padding:4px 10px;border-radius:20px;}

.filterbar{display:flex;gap:10px;align-items:center;margin-bottom:18px;flex-wrap:wrap;}
.gtabs{display:flex;gap:6px;background:var(--card);padding:4px;border-radius:10px;width:fit-content;}
.gtab{padding:7px 18px;border-radius:7px;font-size:13px;cursor:pointer;color:var(--muted);transition:all .2s;font-weight:500;border:none;background:none;}
.gtab.active{background:var(--green);color:#fff;}
.fselect{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:7px 12px;color:var(--text);font-size:12px;outline:none;cursor:pointer;}
.upload-btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:8px 18px;font-size:13px;cursor:pointer;font-weight:600;transition:background .2s;}
.upload-btn:hover{background:var(--green-light);}
.gen-btn{background:var(--blue);color:#fff;border:none;border-radius:8px;padding:8px 18px;font-size:13px;cursor:pointer;font-weight:600;transition:opacity .2s;display:flex;align-items:center;gap:6px;}
.gen-btn:hover{opacity:.85;}

.sgrid{display:grid;grid-template-columns:300px 1fr;gap:18px;}
.slist{background:var(--card);border-radius:14px;border:1px solid var(--border);overflow:hidden;}
.phead{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.phead h3{font-size:14px;font-weight:600;}
.sbox{padding:8px 12px;border-bottom:1px solid var(--border);}
.sbox input{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:7px 11px;color:var(--text);font-size:12px;outline:none;}
.sbox input::placeholder{color:var(--muted);}

.ritem{display:flex;align-items:flex-start;gap:11px;padding:12px 14px;cursor:pointer;transition:background .15s;border-bottom:1px solid rgba(42,61,85,.5);border-left:3px solid transparent;}
.ritem:hover{background:var(--card2);}
.ritem.active{background:rgba(27,110,60,.2);border-left-color:var(--green);}
.rico{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.ri{flex:1;min-width:0;}
.ri h4{font-size:13px;font-weight:600;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ri p{font-size:11px;color:var(--muted);}
.rtags{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap;}

.ppanel{background:var(--card);border-radius:14px;border:1px solid var(--border);overflow:hidden;}
.hdr-teach{background:linear-gradient(135deg,var(--green),#0F4A28);}
.hdr-material{background:linear-gradient(135deg,#1a3a6e,#0d2040);}
.hdr-worksheet{background:linear-gradient(135deg,#5a3a00,#3d2600);}
.pphdr{padding:22px;display:flex;align-items:flex-start;gap:16px;position:relative;overflow:hidden;}
.pphdr::before{content:'';position:absolute;right:-20px;top:-20px;width:120px;height:120px;border-radius:50%;background:rgba(245,197,24,.1);}
.phico{width:60px;height:60px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:28px;background:rgba(0,0,0,.3);flex-shrink:0;border:2px solid rgba(245,197,24,.3);}
.pptitle{flex:1;}
.pptitle h2{font-size:18px;font-weight:700;margin-bottom:4px;}
.pptitle h3{font-size:12px;color:rgba(255,255,255,.6);margin-bottom:8px;}
.ppbadges{display:flex;gap:7px;flex-wrap:wrap;}
.bdg{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;}
.bc{background:var(--yellow);color:#000;}.bi{background:rgba(255,255,255,.15);color:#fff;}.by{background:rgba(255,255,255,.1);color:rgba(255,255,255,.8);}

.ptabs{display:flex;border-bottom:1px solid var(--border);padding:0 20px;overflow-x:auto;}
.ptab{padding:13px 15px;font-size:13px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;transition:all .2s;}
.ptab.active{color:var(--yellow);border-bottom-color:var(--yellow);}
.ptab:hover{color:var(--text);}
.tc{padding:22px;display:none;}
.tc.active{display:block;}

.igrid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:16px;}
.ic{background:var(--card2);border-radius:10px;padding:13px;border:1px solid var(--border);}
.ic label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:5px;}
.ic p{font-size:14px;font-weight:500;}
.stitle{font-size:13px;font-weight:600;color:var(--yellow);margin-bottom:10px;display:flex;align-items:center;gap:5px;}
.ccard{background:var(--card2);border-radius:10px;padding:15px;border:1px solid var(--border);}
.crow{display:flex;justify-content:space-between;margin-bottom:9px;font-size:13px;}
.crow:last-child{margin:0;}
.crow label{color:var(--muted);}

.tag{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;margin:2px;}
.tr{background:rgba(239,68,68,.15);color:#FCA5A5;border:1px solid rgba(239,68,68,.3);}
.tb{background:rgba(59,130,246,.15);color:#93C5FD;border:1px solid rgba(59,130,246,.3);}
.tg{background:rgba(34,197,94,.15);color:#86EFAC;border:1px solid rgba(34,197,94,.3);}
.tgr{background:rgba(148,163,184,.1);color:var(--muted);border:1px solid var(--border);}
.ty{background:rgba(245,197,24,.15);color:#FDE68A;border:1px solid rgba(245,197,24,.3);}
.tp{background:rgba(139,92,246,.15);color:#C4B5FD;border:1px solid rgba(139,92,246,.3);}

.action-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px;}
.abtn{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center;cursor:pointer;transition:all .2s;}
.abtn:hover{border-color:var(--green);background:rgba(27,110,60,.15);}
.abtn .ico{font-size:20px;margin-bottom:5px;}
.abtn p{font-size:12px;color:var(--muted);}

.relcard{background:var(--card2);border-radius:10px;padding:13px;border:1px solid var(--border);margin-bottom:10px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:border-color .2s;}
.relcard:hover{border-color:var(--green);}
.relcard-ico{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}

.logrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);}
.logrow:last-child{border:none;padding-bottom:0;}
.logav{width:32px;height:32px;border-radius:50%;background:rgba(27,110,60,.3);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#4ADE80;flex-shrink:0;}
.loginfo{flex:1;}
.loginfo h4{font-size:13px;font-weight:600;}
.loginfo p{font-size:11px;color:var(--muted);}

/* ── MODAL (upload) ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:100;}
.modal-overlay.show{display:flex;}
.modal{background:var(--card);border-radius:16px;border:1px solid var(--border);padding:28px;width:480px;max-width:92vw;max-height:90vh;overflow-y:auto;}
.modal-title{font-size:16px;font-weight:700;margin-bottom:20px;color:var(--yellow);display:flex;justify-content:space-between;align-items:center;}
.mfield{margin-bottom:14px;}
.mfield label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px;}
.mfield input,.mfield select,.mfield textarea{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--text);font-size:13px;outline:none;font-family:inherit;}
.mfield textarea{height:80px;resize:none;}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.dropzone{border:2px dashed var(--border);border-radius:10px;padding:24px;text-align:center;cursor:pointer;transition:border-color .2s;margin-top:5px;}
.dropzone:hover{border-color:var(--green);}
.dropzone .dico{font-size:28px;margin-bottom:6px;}
.dropzone p{font-size:13px;color:var(--muted);}
.mbtn-row{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;}
.mbtn{padding:9px 20px;border-radius:8px;font-size:13px;cursor:pointer;font-weight:600;border:none;}
.mbtn-cancel{background:var(--card2);color:var(--muted);}
.mbtn-ok{background:var(--green);color:#fff;}
.mbtn-ok:hover{background:var(--green-light);}

/* ── GENERATOR ── */
.gen-overlay{position:fixed;inset:0;background:rgba(5,12,22,.97);z-index:150;display:none;flex-direction:column;padding:16px;}
.gen-overlay.show{display:flex;}
.gen-modal{flex:1;background:var(--dark);border-radius:16px;border:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;min-height:0;}
.gen-hdr{padding:16px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;flex-shrink:0;}
.gen-hdr h2{font-size:16px;font-weight:700;color:var(--text);}
.gen-hdr h2 span{color:var(--yellow);}
.gen-hdr-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
.gen-close{background:var(--card2);border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:7px 14px;font-size:13px;cursor:pointer;transition:all .2s;}
.gen-close:hover{border-color:var(--red);color:#FCA5A5;}
.gen-body{display:grid;grid-template-columns:390px 1fr;flex:1;overflow:hidden;min-height:0;}
.gen-left{border-right:1px solid var(--border);overflow-y:auto;padding:18px;}
.gen-right{overflow-y:auto;padding:20px;background:rgba(10,18,28,.5);}

/* Settings */
.sec-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px;margin-top:4px;}
.set-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:16px;}
.set-full{grid-column:span 2;}
.sfield{display:flex;flex-direction:column;gap:4px;}
.sfield label{font-size:11px;color:var(--muted);}
.sfield input,.sfield select{background:var(--card2);border:1px solid var(--border);border-radius:7px;padding:7px 10px;color:var(--text);font-size:12px;outline:none;font-family:inherit;}
.sfield input:focus,.sfield select:focus{border-color:var(--green);}

/* Presets */
.preset-row{display:flex;gap:7px;margin-bottom:16px;flex-wrap:wrap;}
.preset-btn{background:var(--card2);border:1px solid var(--border);border-radius:7px;padding:6px 12px;font-size:11px;color:var(--muted);cursor:pointer;transition:all .15s;white-space:nowrap;}
.preset-btn:hover{border-color:var(--yellow);color:var(--yellow);}

/* Difficulty summary */
.diff-summary{display:flex;gap:6px;margin-bottom:14px;align-items:center;flex-wrap:wrap;}
.dsm{padding:4px 11px;border-radius:20px;font-size:11px;font-weight:700;}
.dsm-e{background:rgba(34,197,94,.15);color:#86EFAC;border:1px solid rgba(34,197,94,.3);}
.dsm-m{background:rgba(245,159,24,.15);color:#FDE68A;border:1px solid rgba(245,159,24,.3);}
.dsm-h{background:rgba(239,68,68,.15);color:#FCA5A5;border:1px solid rgba(239,68,68,.3);}
.dsm-t{background:rgba(59,130,246,.15);color:#93C5FD;border:1px solid rgba(59,130,246,.3);}
.dsm-pts{background:rgba(139,92,246,.15);color:#C4B5FD;border:1px solid rgba(139,92,246,.3);}

/* Question rows */
.qrow{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px;transition:border-color .2s;}
.qrow:hover{border-color:rgba(27,110,60,.5);}
.qrow-top{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.qnum{width:22px;height:22px;background:var(--green);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;color:#fff;}
.qtype-lbl{font-size:11px;color:var(--muted);flex:1;}
.diff-group{display:flex;gap:3px;}
.diff-btn{padding:4px 9px;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--muted);transition:all .15s;line-height:1;}
.diff-btn:hover{opacity:.8;}
.diff-btn.d-easy.on{background:rgba(34,197,94,.2);border-color:#22C55E;color:#86EFAC;}
.diff-btn.d-mid.on{background:rgba(245,159,24,.2);border-color:#F59E0B;color:#FDE68A;}
.diff-btn.d-hard.on{background:rgba(239,68,68,.2);border-color:#EF4444;color:#FCA5A5;}
.qtext{font-size:12px;color:var(--text);line-height:1.55;margin-bottom:8px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.qrow-bot{display:flex;align-items:center;gap:5px;}
.qmeta span{font-size:11px;color:var(--muted);margin-right:5px;}
.qact{margin-left:auto;display:flex;gap:4px;}
.qact-btn{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:4px 8px;font-size:11px;color:var(--muted);cursor:pointer;transition:all .15s;}
.qact-btn:hover{border-color:var(--green-light);color:var(--text);}
.del-btn:hover{border-color:var(--red)!important;color:#FCA5A5!important;}

.add-q-btn{width:100%;background:rgba(27,110,60,.1);border:1px dashed rgba(27,110,60,.5);border-radius:10px;padding:11px;color:#4ADE80;font-size:13px;cursor:pointer;transition:background .2s;margin-top:6px;}
.add-q-btn:hover{background:rgba(27,110,60,.22);}

/* Preview */
.preview-topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.preview-topbar h3{font-size:14px;font-weight:600;color:var(--yellow);}
.pbtn-row{display:flex;gap:8px;}
.pbtn{padding:8px 16px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:none;display:flex;align-items:center;gap:5px;transition:opacity .2s;}
.pbtn:hover{opacity:.85;}
.pbtn-print{background:var(--green);color:#fff;}
.pbtn-save{background:var(--card2);color:var(--text);border:1px solid var(--border);}

.preview-paper{background:#fff;color:#111;border-radius:10px;padding:36px 40px;max-width:680px;margin:0 auto;box-shadow:0 4px 24px rgba(0,0,0,.4);}
.pp-school{font-size:11px;text-align:center;color:#555;margin-bottom:3px;letter-spacing:.3px;}
.pp-title{font-size:20px;font-weight:800;text-align:center;margin-bottom:3px;}
.pp-subtitle{font-size:11px;text-align:center;color:#777;margin-bottom:14px;}
.pp-info-bar{display:flex;gap:0;border-top:2px solid #222;border-bottom:1px solid #bbb;padding:9px 0;margin-bottom:18px;}
.pp-info-bar span{flex:1;font-size:12px;border-right:1px solid #ddd;padding:0 12px;}
.pp-info-bar span:first-child{padding-left:0;}
.pp-info-bar span:last-child{border-right:none;}
.pp-info-bar span b{display:block;font-size:10px;color:#888;font-weight:500;margin-bottom:2px;}
.pp-infobar-blank{display:inline-block;border-bottom:1px solid #aaa;width:80px;margin-left:4px;}
.pp-q{margin-bottom:16px;}
.pp-q-hdr{display:flex;align-items:flex-start;gap:8px;}
.pp-q-num{font-size:13px;font-weight:800;width:24px;flex-shrink:0;padding-top:1px;}
.pp-q-text{font-size:13px;line-height:1.65;flex:1;}
.pp-q-mark{font-size:11px;color:#888;white-space:nowrap;padding-top:2px;flex-shrink:0;}
.pp-q-ans{margin-left:32px;margin-top:8px;}
.ans-line{border-bottom:1px solid #ccc;height:26px;margin-bottom:6px;}
.diff-pill{display:inline-block;padding:1px 6px;border-radius:8px;font-size:9px;font-weight:800;margin-left:5px;vertical-align:middle;}
.dp-e{background:#dcfce7;color:#15803d;}
.dp-m{background:#fef9c3;color:#78350f;}
.dp-h{background:#fee2e2;color:#991b1b;}
.pp-divider{border:none;border-top:1px dashed #ccc;margin:12px 0;}
.pp-total{text-align:right;font-size:12px;font-weight:700;color:#333;border-top:2px solid #222;padding-top:10px;margin-top:6px;}
.pp-empty{text-align:center;padding:40px;color:#bbb;font-size:14px;}

/* Toast */
.toast{position:fixed;bottom:24px;right:24px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 18px;font-size:13px;z-index:300;display:none;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.5);}
.toast.show{display:flex;}

@media print{
  body > .main,.modal-overlay,.gen-overlay ~ *{display:none!important;}
  .gen-overlay{position:static!important;background:none!important;padding:0!important;display:block!important;}
  .gen-modal{border:none!important;display:block!important;}
  .gen-hdr,.gen-left,.preview-topbar{display:none!important;}
  .gen-body{display:block!important;}
  .gen-right{overflow:visible!important;background:none!important;padding:0!important;}
  .preview-paper{box-shadow:none!important;border-radius:0!important;padding:20px!important;}
}
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
</style>
</head>
<body>

<main class="main">
  <div class="topbar">
    <div>
      <h1>教學資源管理 <span>T-01</span></h1>
      <p style="font-size:12px;color:var(--muted);margin-top:3px;">香港青少年培育會陳南昌紀念學校</p>
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
      <span class="badge-demo">DEMO</span>
      <div style="width:7px;height:7px;border-radius:50%;background:#F59E0B;"></div>
      <span style="font-size:12px;color:var(--muted);">Supabase 待接駁</span>
    </div>
  </div>

  <div class="filterbar">
    <div class="gtabs" id="typeTabs">
      <button class="gtab active" onclick="filterType('全部',this)">全部</button>
      <button class="gtab" onclick="filterType('教案',this)">教案</button>
      <button class="gtab" onclick="filterType('教材',this)">教材</button>
      <button class="gtab" onclick="filterType('工作紙',this)">工作紙</button>
    </div>
    <select class="fselect" id="subjectFilter" onchange="applyFilters()">
      <option value="">所有科目</option>
      <option>中文</option><option>英文</option><option>數學</option>
      <option>科學</option><option>歷史</option><option>體育</option>
    </select>
    <select class="fselect" id="gradeFilter" onchange="applyFilters()">
      <option value="">所有年級</option>
      <option>中一</option><option>中二</option><option>中三</option>
    </select>
    <button class="gen-btn" onclick="openGenerator()">📝 出卷生成</button>
    <button class="upload-btn" onclick="showModal()">＋ 上傳資源</button>
  </div>

  <div class="sgrid">
    <div class="slist">
      <div class="phead">
        <h3>資源庫</h3>
        <span style="font-size:11px;color:var(--muted);" id="countLabel">6 項資源</span>
      </div>
      <div class="sbox">
        <input type="text" id="searchInput" placeholder="搜尋資源名稱…" oninput="applyFilters()"/>
      </div>
      <div id="resourceList"></div>
    </div>

    <div class="ppanel">
      <div id="detailHdr" class="pphdr hdr-teach">
        <div class="phico" id="detailIco">📄</div>
        <div class="pptitle">
          <h2 id="detailName"></h2>
          <h3 id="detailSub"></h3>
          <div class="ppbadges" id="detailBadges"></div>
        </div>
      </div>
      <div class="ptabs">
        <div class="ptab active" onclick="showTab('info')">詳情</div>
        <div class="ptab" onclick="showTab('related')">相關資源</div>
        <div class="ptab" onclick="showTab('log')">共享記錄</div>
      </div>
      <div class="tc active" id="tab-info"></div>
      <div class="tc" id="tab-related"></div>
      <div class="tc" id="tab-log"></div>
    </div>
  </div>
</main>

<!-- Upload Modal -->
<div class="modal-overlay" id="uploadModal">
  <div class="modal">
    <div class="modal-title">
      📤 上傳教學資源
      <span style="cursor:pointer;color:var(--muted);font-size:20px;line-height:1;" onclick="hideModal()">✕</span>
    </div>
    <div class="mfield">
      <label>資源名稱</label>
      <input type="text" placeholder="例：中二說明文寫作教案"/>
    </div>
    <div class="mrow">

let paperQuestions=[];    // [{diff, qObj}]
let usedIdxMap={};        // {subject_diff: Set}

function resetUsed(){usedIdxMap={};}

function sampleQ(subject, diff){
  const pool=qBank[subject]?.[diff];
  if(!pool||!pool.length) return null;
  const key=subject+'_'+diff;
  if(!usedIdxMap[key]) usedIdxMap[key]=new Set();
  let avail=pool.map((_,i)=>i).filter(i=>!usedIdxMap[key].has(i));
  if(!avail.length){usedIdxMap[key].clear(); avail=pool.map((_,i)=>i);}
  const idx=avail[Math.floor(Math.random()*avail.length)];
  usedIdxMap[key].add(idx);
  return{...pool[idx],_poolIdx:idx};
}

function openGenerator(){
  resetUsed();
  paperQuestions=[];
  document.getElementById('gTitle').value='';
  document.getElementById('gClass').value='';
  document.getElementById('gTime').value='45';
  document.getElementById('gSubject').value='數學';
  document.getElementById('gGrade').value='中二';
  // default: 2 easy, 2 mid, 2 hard
  applyPreset([['易','易'],['中','中'],['難','難']]);
  document.getElementById('genOverlay').classList.add('show');
}
function closeGenerator(){
  document.getElementById('genOverlay').classList.remove('show');
}

function onSubjectChange(){
  resetUsed();
  paperQuestions=paperQuestions.map(pq=>{
    pq.qObj=sampleQ(getSubject(), pq.diff);
    return pq;
  });
  renderQRows();
  renderPreview();
}

function applyPreset(groups){
  resetUsed();
  paperQuestions=[];
  groups.forEach(diffs=>diffs.forEach(d=>paperQuestions.push({diff:d,qObj:sampleQ(getSubject(),d)})));
  renderQRows();
  renderPreview();
}

function addQuestion(diff){
  const q=sampleQ(getSubject(), diff);
  paperQuestions.push({diff, qObj:q});
  renderQRows();
  renderPreview();
}

function setDiff(idx, diff){
  paperQuestions[idx].diff=diff;
  paperQuestions[idx].qObj=sampleQ(getSubject(), diff);
  renderQRows();
  renderPreview();
}

function resampleQ(idx){
  const diff=paperQuestions[idx].diff;
  paperQuestions[idx].qObj=sampleQ(getSubject(), diff);
  renderQRows();
  renderPreview();
}

function removeQ(idx){
  paperQuestions.splice(idx,1);
  renderQRows();
  renderPreview();
}

function getSubject(){return document.getElementById('gSubject').value;}

const diffLabel={'易':'易','中':'中','難':'難'};
const diffCls={'易':'d-easy','中':'d-mid','難':'d-hard'};
const diffPillCls={'易':'dp-e','中':'dp-m','難':'dp-h'};

function renderQRows(){
  const easy=paperQuestions.filter(q=>q.diff==='易').length;
  const mid=paperQuestions.filter(q=>q.diff==='中').length;
  const hard=paperQuestions.filter(q=>q.diff==='難').length;
  const total=paperQuestions.length;
  const totalMark=paperQuestions.reduce((a,q)=>a+(q.qObj?q.qObj.marks:0),0);

  document.getElementById('qCountLabel').textContent=`共 ${total} 題`;
  document.getElementById('diffSummary').innerHTML=
    `<span class="dsm dsm-e">易 ${easy}</span>`+
    `<span class="dsm dsm-m">中 ${mid}</span>`+
    `<span class="dsm dsm-h">難 ${hard}</span>`+
    `<span class="dsm dsm-t">合計 ${total} 題</span>`+
    `<span class="dsm dsm-pts">共 ${totalMark} 分</span>`;

  document.getElementById('qRows').innerHTML=paperQuestions.map((pq,i)=>{
    const q=pq.qObj;
    const diffs=['易','中','難'];
    return`<div class="qrow">
      <div class="qrow-top">
        <div class="qnum">${i+1}</div>
        <span class="qtype-lbl">${q?q.type:'—'}</span>
        <div class="diff-group">
          ${diffs.map(d=>`<button class="diff-btn ${diffCls[d]}${pq.diff===d?' on':''}" onclick="setDiff(${i},'${d}')">${d}</button>`).join('')}
        </div>
      </div>
      <div class="qtext">${q?q.q:'（此程度暫無題目）'}</div>
      <div class="qrow-bot">
        <div class="qmeta">
          ${q?`<span>${q.type}</span><span style="color:${pq.diff==='易'?'#86EFAC':pq.diff==='中'?'#FDE68A':'#FCA5A5'}">${q.marks} 分</span>`:''}
        </div>
        <div class="qact">
          <button class="qact-btn" onclick="resampleQ(${i})" title="重新取樣">🔄 重取</button>
          <button class="qact-btn del-btn" onclick="removeQ(${i})" title="移除此題">✕</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function renderPreview(){
  const title=document.getElementById('gTitle').value||'（未命名試卷）';
  const subject=getSubject();
  const grade=document.getElementById('gGrade').value;
  const cls=document.getElementById('gClass').value;
  const time=document.getElementById('gTime').value;
  const totalMark=paperQuestions.reduce((a,q)=>a+(q.qObj?q.qObj.marks:0),0);

  if(!paperQuestions.length){
    document.getElementById('previewPaper').innerHTML=`<div class="preview-paper"><div class="pp-empty">尚未加入任何題目<br><span style="font-size:12px;margin-top:6px;display:block;">請在左方選擇快速預設，或手動加入題目</span></div></div>`;
    return;
  }

  const qHTML=paperQuestions.map((pq,i)=>{
    const q=pq.qObj;
    if(!q) return`<div class="pp-q"><div class="pp-q-hdr"><span class="pp-q-num">${i+1}.</span><span class="pp-q-text" style="color:#aaa;">（此程度暫無題目）</span></div></div>`;
    const ansLines=q.marks<=2?1:q.marks<=5?2:3;
    const lines=Array(ansLines).fill('<div class="ans-line"></div>').join('');
    return`<div class="pp-q">
      <div class="pp-q-hdr">
        <span class="pp-q-num">${i+1}.</span>
        <span class="pp-q-text">${q.q}<span class="diff-pill ${diffPillCls[pq.diff]}">${pq.diff}</span></span>
        <span class="pp-q-mark">（${q.marks} 分）</span>
      </div>
      <div class="pp-q-ans">${lines}</div>
    </div><hr class="pp-divider">`;
  }).join('');

  document.getElementById('previewPaper').innerHTML=`
    <div class="preview-paper" id="printTarget">
      <div class="pp-school">香港青少年培育會陳南昌紀念學校</div>
      <div class="pp-title">${title}</div>
      <div class="pp-subtitle">${grade} · ${subject} · 作答時間：${time} 分鐘 · 滿分：${totalMark} 分</div>
      <div class="pp-info-bar">
        <span><b>班別</b>${cls||'______'}</span>
        <span><b>姓名</b>________________</span>
        <span><b>學號</b>________</span>
        <span><b>日期</b>________________</span>
        <span><b>分數</b>______ / ${totalMark}</span>
      </div>
      ${qHTML}
      <div class="pp-total">Total / 總分：______ / ${totalMark} 分</div>
    </div>`;
}
