.tf{animation:tfa .18s ease}

.nb{transition:all .15s}.nb.on{background:#eff6ff;color:#1d4ed8}
.st.on{background:#2563eb;color:#fff}
.rb{transition:all .15s}.rb.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.1);color:#111}
.sc:hover{box-shadow:0 4px 16px rgba(0,0,0,.08)}
.tc{cursor:pointer;transition:all .15s}.tc:hover{box-shadow:0 4px 16px rgba(0,0,0,.08);transform:translateY(-2px)}
.lbr:hover{background:#f8fafc}
.si:hover{box-shadow:0 2px 12px rgba(0,0,0,.07)}
.gbar{height:24px;border-radius:6px;display:flex;align-items:center;padding:0 8px;font-size:11px;font-weight:500;overflow:hidden;white-space:nowrap;position:absolute;top:6px}.gbar:hover{opacity:.8}
.ntf{position:fixed;top:1rem;right:1rem;z-index:200;padding:.7rem 1rem;border-radius:.8rem;font-size:.85rem;font-weight:500;border:1px solid;box-shadow:0 4px 20px rgba(0,0,0,.12);animation:ni .22s ease}
@keyframes ni{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.2);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center;padding:1rem}
.mb{background:#fff;border-radius:1.25rem;padding:1.5rem;width:100%;max-width:28rem;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.18)}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
input:focus,select:focus{outline:none;border-color:#60a5fa!important}
</style>

let nT=null;
function ntf(msg,type='ok'){
  clearTimeout(nT);
  document.getElementById('N').innerHTML=`<div class="ntf ${type==='err'?'bg-red-50 text-red-700 border-red-200':'bg-white text-gray-800 border-gray-200'}">${msg}</div>`;
  nT=setTimeout(()=>{document.getElementById('N').innerHTML='';},2500);
}

/* ── CHARTS ── */
let bC=null,pC=null;
function initCharts(){
  if(typeof Chart==='undefined')return;
  const bc=document.getElementById('bc'),pc=document.getElementById('pc');
  if(!bc||!pc)return;
  if(bC){bC.destroy();bC=null;}
  if(pC){pC.destroy();pC=null;}
  bC=new Chart(bc,{type:'bar',data:{labels:MP.map(d=>d.m),datasets:[{label:'加分',data:MP.map(d=>d.e),backgroundColor:'#3b82f6',borderRadius:4},{label:'兌換',data:MP.map(d=>d.r),backgroundColor:'#8b5cf6',borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{font:{size:11},color:'#6b7280'}}},scales:{x:{grid:{display:false},ticks:{font:{size:11},color:'#9ca3af'}},y:{grid:{color:'#f3f4f6'},ticks:{font:{size:11},color:'#9ca3af'}}}}});
  pC=new Chart(pc,{type:'doughnut',data:{labels:PD.map(d=>d.n),datasets:[{data:PD.map(d=>d.v),backgroundColor:PD.map(d=>d.c),borderWidth:2,borderColor:'#fff'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},cutout:'55%'}});
}

    <div class="flex items-center gap-2">

        🔔<span style="position:absolute;top:4px;right:4px;width:8px;height:8px;background:#ef4444;border-radius:50%"></span>
      </button>
      <div class="w-8 h-8 rounded-full flex items-center justify-center text-white text-sm" style="background:linear-gradient(135deg,#3b82f6,#4f46e5)">👤</div>
    </div>
  </div>
  <div class="flex flex-1 overflow-hidden">
    <div class="flex-shrink-0 bg-white border-r border-gray-100 p-4 flex flex-col" style="width:208px">
      <nav class="space-y-1 flex-1">
        ${NV.map(n=>`<button onclick="gTab('${n.id}')" class="nb w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium ${S.tab===n.id?'on':'text-gray-600 hover:bg-gray-50 hover:text-gray-900'}">${n.e} ${n.l}</button>`).join('')}
      </nav>
      <div class="pt-4 border-t border-gray-100">
        <div class="px-3 py-3 bg-gray-50 rounded-xl">
          <p class="text-xs font-semibold text-gray-700">${RL.find(r=>r.id===S.role)?.l}</p>
          <p class="text-xs text-gray-400 mt-0.5 leading-relaxed">${RL.find(r=>r.id===S.role)?.h}</p>
        </div>
      </div>
    </div>
    <div class="flex-1 overflow-y-auto p-6">
      <div class="tf">${c}</div>
    </div>
  </div>`;

  if(S.tab==='reports')setTimeout(initCharts,80);
  rMod();
}

/* ── HANDLERS ── */
function gTab(t){S.tab=t;render();}
function gRole(r){S.role=r;render();}
function cType(id){if(id==='rewards')gTab('rewards_tab');else if(id==='studytour')gTab('nodes');else ntf((TT.find(t=>t.id===id)?.n||id)+' — 完整 Demo 開發中');}
function sRS(t){S.rSub=t;render();}
function sRF(f){S.rF=f;render();}
function sSS(id){S.shopS=parseInt(id);render();}
function tgN(id){S.exN=S.exN===id?null:id;render();}
function oMod(sid=null){S.modal=true;S.selS=sid;S.ptA='';S.ptR='';S.ptT='add';rMod();}
function cMod(){S.modal=false;document.getElementById('M').innerHTML='';}
function sPT(t){S.ptT=t;rMod();}
function sSel(id){S.selS=id;rMod();}
function sPR(r){S.ptR=r;const el=document.getElementById('ptR');if(el)el.value=r;rMod();}
function doPts(){
  const amt=parseInt(S.ptA);
  if(!S.selS||!amt||amt<=0||!S.ptR.trim())return;
  const stu=S.stus.find(s=>s.id===S.selS);if(!stu)return;
  S.stus=S.stus.map(s=>s.id===S.selS?{...s,pts:S.ptT==='add'?s.pts+amt:Math.max(0,s.pts-amt)}:s);
  S.txns=[{id:Date.now(),n:stu.n,sid:stu.id,t:S.ptT,a:amt,r:S.ptR.trim(),by:S.role==='teacher'?'老師':'管理員',tm:'剛剛'},...S.txns];
  const msg=(S.ptT==='add'?'已加 ':'已扣 ')+amt+' 積分 ✓';
  cMod();render();ntf(msg);
}
function dRdm(stuId,itemId){
  const stu=S.stus.find(s=>s.id===stuId);
  const item=SH.find(i=>i.id===itemId);
  if(!stu||!item)return;
  if(stu.pts<item.c){ntf('積分不足！','err');return;}
  S.stus=S.stus.map(s=>s.id===stuId?{...s,pts:s.pts-item.c}:s);
  S.txns=[{id:Date.now(),n:stu.n,sid:stu.id,t:'redeem',a:item.c,r:'兌換'+item.n,by:'System',tm:'剛剛'},...S.txns];
  render();ntf(stu.n+' 成功兌換 '+item.n+'！');
}

render();
</script>
