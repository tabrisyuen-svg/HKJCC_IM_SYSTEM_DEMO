<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>陳南昌紀念學校 · 點名系統</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --green:#1B6E3C;--gl:#24A05A;--yellow:#F5C518;
  --dark:#0D1B2A;--card:#162032;--card2:#1E2D42;
  --border:#2A3D55;--text:#E8EDF3;--muted:#7A90A8;
  --present:#22C55E;--late:#F59E0B;--sick:#3B82F6;
  --personal:#8B5CF6;--absent:#EF4444;--early:#F97316;
}
body{font-family:'Segoe UI','Microsoft JhengHei',sans-serif;background:var(--dark);color:var(--text);display:flex;min-height:100vh;}

/* ── Sidebar ── */
.sidebar{width:240px;min-height:100vh;background:linear-gradient(180deg,#0A1520,#0F1E30);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;z-index:200;transition:transform .3s;}
.logo-wrap{padding:18px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.logo-badge{width:40px;height:40px;background:var(--green);border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--yellow);font-size:15px;flex-shrink:0;}
.logo-txt h2{font-size:10.5px;color:var(--yellow);font-weight:700;}
.logo-txt p{font-size:9px;color:var(--muted);margin-top:2px;}
.nav-lbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;padding:12px 12px 6px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--muted);transition:all .2s;margin:1px 8px;}
.nav-item:hover{background:var(--card2);color:var(--text);}
.nav-item.active{background:var(--green);color:#fff;}
.nav-item.active .ni{color:var(--yellow);}
.ni{font-size:16px;width:20px;text-align:center;}
.sb-foot{padding:14px;border-top:1px solid var(--border);margin-top:auto;}

/* ── Main ── */
.main{margin-left:240px;flex:1;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0;}

/* ── Topbar ── */
.topbar{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;}
.page-title h1{font-size:20px;font-weight:700;}
.page-title h1 span{color:var(--yellow);}
.page-title p{font-size:12px;color:var(--muted);margin-top:3px;}
.top-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.demo-badge{background:var(--yellow);color:#000;font-size:10px;font-weight:700;padding:4px 10px;border-radius:20px;}
.lock-pill{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;border:1px solid;}
.lp-open{background:rgba(34,197,94,.12);color:#22C55E;border-color:rgba(34,197,94,.3);}
.lp-locked{background:rgba(239,68,68,.12);color:#EF4444;border-color:rgba(239,68,68,.3);}

/* ── Controls ── */
.ctrl-bar{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 18px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;}
.cg{display:flex;flex-direction:column;gap:4px;}
.cg label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
.c-input{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--text);font-size:13px;outline:none;}
.c-input:focus{border-color:var(--gl);}
select.c-input option{background:var(--card2);}
.sess-wrap{display:flex;background:var(--card2);border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.sess-btn{padding:8px 18px;font-size:13px;cursor:pointer;color:var(--muted);transition:all .2s;font-weight:500;user-select:none;}
.sess-btn.active{background:var(--green);color:#fff;}
.audit-box{margin-left:auto;background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:8px 14px;}
.audit-box p{font-size:11px;color:var(--muted);line-height:2;}
.audit-box strong{color:var(--text);font-weight:500;}

/* ── Quick actions ── */
.qa-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.qa-btn{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid;transition:all .15s;user-select:none;}
.qa-btn:active{transform:scale(.97);}
.qa-all{background:rgba(34,197,94,.12);color:#22C55E;border-color:rgba(34,197,94,.3);}
.qa-all:hover{background:rgba(34,197,94,.22);}
.qa-clr{background:rgba(239,68,68,.1);color:#EF4444;border-color:rgba(239,68,68,.25);}
.qa-clr:hover{background:rgba(239,68,68,.2);}
.qa-flt{background:var(--card2);color:var(--muted);border-color:var(--border);}
.qa-flt.on{background:rgba(245,197,24,.12);color:var(--yellow);border-color:rgba(245,197,24,.3);}
.autosave-wrap{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);}
.save-dot{width:7px;height:7px;border-radius:50%;background:#22C55E;flex-shrink:0;}
.save-dot.busy{background:var(--yellow);animation:blink .7s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* ── Stats ── */
.stats-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 18px;}
.stats-row{display:flex;flex-wrap:wrap;gap:18px;align-items:center;}
.st-item{display:flex;align-items:center;gap:7px;}
.st-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.st-lbl{font-size:12px;color:var(--muted);}
.st-num{font-size:17px;font-weight:700;min-width:22px;}
.prog-wrap{margin-top:12px;height:5px;background:var(--border);border-radius:3px;overflow:hidden;}
.prog-bar{height:100%;background:linear-gradient(90deg,var(--green),var(--gl));border-radius:3px;transition:width .3s;}

/* ── List ── */
.list-card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.list-hdr{padding:12px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.list-hdr h3{font-size:14px;font-weight:600;}
.ct-badge{background:var(--card2);color:var(--muted);font-size:11px;padding:3px 9px;border-radius:20px;}
.list-hint{margin-left:auto;font-size:11px;color:var(--muted);}

/* ── Student row ── */
.s-row{border-bottom:1px solid rgba(42,61,85,.45);transition:background .12s;}
.s-row:last-child{border-bottom:none;}
.s-row.hide{display:none;}
.row-main{display:flex;align-items:center;padding:9px 16px;gap:10px;min-height:56px;}
.s-no{width:22px;font-size:11px;color:var(--muted);flex-shrink:0;text-align:center;}
.s-av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0;}
.s-name{flex:1;min-width:0;}
.s-name h4{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.s-name p{font-size:11px;color:var(--muted);}
.st-btns{display:flex;gap:4px;flex-wrap:nowrap;flex-shrink:0;}
.stb{padding:6px 10px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.04);color:var(--muted);transition:all .15s;white-space:nowrap;user-select:none;-webkit-tap-highlight-color:transparent;min-height:34px;display:flex;align-items:center;}
.stb:hover{background:var(--card2);color:var(--text);}
.stb:active{transform:scale(.94);}
.stb-short{display:none;}
.stb.sp{background:var(--present);color:#fff;border-color:var(--present);}
.stb.sl{background:var(--late);color:#000;border-color:var(--late);}
.stb.ss{background:var(--sick);color:#fff;border-color:var(--sick);}
.stb.sv{background:var(--personal);color:#fff;border-color:var(--personal);}
.stb.sa{background:var(--absent);color:#fff;border-color:var(--absent);}
.stb.se{background:var(--early);color:#fff;border-color:var(--early);}
.act-btns{display:flex;gap:4px;flex-shrink:0;}
.act-btn{width:32px;height:32px;border-radius:7px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0;}
.act-btn:hover{background:var(--card2);}
.act-btn.note-on{border-color:var(--yellow);color:var(--yellow);background:rgba(245,197,24,.08);}
.act-btn.flag-on{border-color:#EF4444;color:#EF4444;background:rgba(239,68,68,.08);}

/* Left border status indicator */
.s-row[data-st="present"] .row-main{border-left:3px solid var(--present);}
.s-row[data-st="late"]    .row-main{border-left:3px solid var(--late);}
.s-row[data-st="sick"]    .row-main{border-left:3px solid var(--sick);}
.s-row[data-st="personal"].row-main{border-left:3px solid var(--personal);}
.s-row[data-st="absent"]  .row-main{border-left:3px solid var(--absent);}
.s-row[data-st="early"]   .row-main{border-left:3px solid var(--early);}
.s-row[data-st="unset"]   .row-main{border-left:3px solid transparent;}

/* ── Detail expand ── */
.row-det{background:rgba(14,26,40,.7);border-top:1px solid rgba(42,61,85,.4);padding:13px 16px 15px;display:none;}
.row-det.open{display:block;animation:fadeSlide .18s ease;}
@keyframes fadeSlide{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.det-grid{display:flex;flex-wrap:wrap;gap:11px;align-items:flex-end;}
.det-item{display:flex;flex-direction:column;gap:4px;}
.det-item label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
.det-in{background:var(--card);border:1px solid var(--border);border-radius:7px;padding:7px 10px;color:var(--text);font-size:13px;outline:none;transition:border-color .2s;}
.det-in:focus{border-color:var(--gl);}
select.det-in option{background:var(--card2);}
.notify-row{display:flex;align-items:center;gap:7px;cursor:pointer;font-size:13px;color:var(--text);}
.notify-row input[type=checkbox]{width:15px;height:15px;accent-color:var(--yellow);}
.notify-active{color:var(--yellow);font-weight:600;}

/* ── Bottom bar ── */
.bot-bar{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:13px 18px;display:flex;gap:9px;align-items:center;flex-wrap:wrap;}
.bot-btn{padding:9px 20px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid;transition:all .15s;}
.bot-btn:active{transform:scale(.97);}
.bb-lock{background:rgba(34,197,94,.12);color:#22C55E;border-color:rgba(34,197,94,.3);}
.bb-lock:hover{background:rgba(34,197,94,.22);}
.bb-export{background:var(--card2);color:var(--text);border-color:var(--border);}
.bb-export:hover{border-color:var(--gl);}
.bot-status{margin-left:auto;font-size:12px;color:var(--muted);}

/* ── Toast ── */
.toast{position:fixed;bottom:20px;right:20px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:11px 16px;font-size:13px;display:flex;align-items:center;gap:8px;box-shadow:0 8px 32px rgba(0,0,0,.5);z-index:999;transform:translateY(70px);opacity:0;transition:all .25s;pointer-events:none;}
.toast.on{transform:none;opacity:1;}

/* ── Mobile ── */
.mob-menu{display:none;width:38px;height:38px;border-radius:8px;background:var(--card);border:1px solid var(--border);align-items:center;justify-content:center;cursor:pointer;font-size:18px;flex-shrink:0;}

@media(max-width:1150px){
  .stb-full{display:none;}
  .stb-short{display:inline;}
  .stb{padding:7px 8px;}
}
@media(max-width:900px){
  .sidebar{transform:translateX(-240px);}
  .sidebar.open{transform:none;}
  .main{margin-left:0;}
  .mob-menu{display:flex;}
  .audit-box{display:none;}
}
@media(max-width:600px){
  .main{padding:12px;}
  .s-name p{display:none;}
  .stb{padding:8px 6px;min-width:32px;}
  .act-btn{width:28px;height:28px;}
}
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
</style>
</head>
<body>

<!-- Sidebar -->
<aside class="sidebar" id="sidebar">
  <div class="logo-wrap">
    <div class="logo-badge">陳</div>
    <div class="logo-txt">
      <h2>陳南昌紀念學校</h2>
      <p>Chan Nam Cheong Memorial School</p>
    </div>
  </div>
  <nav style="flex:1;overflow-y:auto;padding:6px 0;">
    <div class="nav-lbl">主選單</div>
    <div class="nav-item"><span class="ni">👤</span>學生檔案</div>
    <div class="nav-item active"><span class="ni">📋</span>點名系統</div>
    <div class="nav-item"><span class="ni">⭐</span>加減分</div>
    <div class="nav-item"><span class="ni">📊</span>統計報告</div>
    <div class="nav-lbl">管理</div>
    <div class="nav-item"><span class="ni">⚙️</span>行為項目設定</div>
    <div class="nav-item"><span class="ni">📁</span>匯入 / 匯出</div>
    <div class="nav-item"><span class="ni">🔒</span>權限管理</div>
  </nav>
  <div class="sb-foot">
    <div style="display:flex;align-items:center;gap:10px;">
      <div style="width:34px;height:34px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;">李</div>
      <div>
        <p style="font-size:12px;font-weight:600;">李老師</p>
        <p style="font-size:10px;color:var(--muted);">班主任 · 2A</p>
      </div>
      <div style="margin-left:auto;width:7px;height:7px;border-radius:50%;background:#22C55E;"></div>
    </div>
  </div>
</aside>

<!-- Main -->
<main class="main">

  <!-- Topbar -->
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:10px;">
      <button class="mob-menu" id="mobMenu">☰</button>
      <div class="page-title">
        <h1>點名系統 <span>D-02</span></h1>
        <p>上午 / 下午出席記錄</p>
      </div>
    </div>
    <div class="top-right">
      <span class="demo-badge">DEMO</span>
      <div class="lock-pill lp-open" id="lockPill" onclick="toggleLock()">
        <span id="lockIco">🔓</span>
        <span id="lockTxt">點名進行中</span>
      </div>
    </div>
  </div>

  <!-- Controls -->
  <div class="ctrl-bar">
    <div class="cg">
      <label>日期</label>
      <input type="date" class="c-input" id="dateIn" value="2026-11-09">
    </div>
    <div class="cg">
      <label>時段</label>
      <div class="sess-wrap">
        <div class="sess-btn active" id="sAM" onclick="setSess('AM')">🌤 上午</div>
        <div class="sess-btn" id="sPM" onclick="setSess('PM')">🌙 下午</div>
      </div>
    </div>
    <div class="cg">
      <label>班別</label>
      <select class="c-input" id="classIn">
        <option>中一 1A</option>
        <option>中一 1B</option>
        <option selected>中二 2A</option>
        <option>中二 2B</option>
        <option>中三 3A</option>
        <option>中三 3B</option>
      </select>
    </div>
    <div class="audit-box">
      <p>點名老師：<strong id="aTeacher">李老師</strong></p>
      <p>開始時間：<strong id="aStart">—</strong></p>
      <p>完成時間：<strong id="aDone">—</strong></p>
    </div>
  </div>

  <!-- Quick actions -->
  <div class="qa-row">
    <button class="qa-btn qa-all" onclick="markAllPresent()">✅ 全部出席</button>
    <button class="qa-btn qa-clr" onclick="clearAll()">🗑 清除全部</button>
    <button class="qa-btn qa-flt" id="fltBtn" onclick="toggleFilter()">👁 只顯示未點名</button>
    <div class="autosave-wrap">
      <div class="save-dot" id="saveDot"></div>
      <span id="saveTxt">草稿已儲存</span>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats-card">
    <div class="stats-row">
      <div class="st-item"><div class="st-dot" style="background:#64748B;"></div><span class="st-lbl">未點名</span><span class="st-num" id="cn-u" style="color:#94A3B8;">15</span></div>
      <div class="st-item"><div class="st-dot" style="background:var(--present);"></div><span class="st-lbl">出席</span><span class="st-num" id="cn-p" style="color:var(--present);">0</span></div>
      <div class="st-item"><div class="st-dot" style="background:var(--late);"></div><span class="st-lbl">遲到</span><span class="st-num" id="cn-l" style="color:var(--late);">0</span></div>
      <div class="st-item"><div class="st-dot" style="background:var(--sick);"></div><span class="st-lbl">病假</span><span class="st-num" id="cn-s" style="color:var(--sick);">0</span></div>
      <div class="st-item"><div class="st-dot" style="background:var(--personal);"></div><span class="st-lbl">事假</span><span class="st-num" id="cn-v" style="color:var(--personal);">0</span></div>
      <div class="st-item"><div class="st-dot" style="background:var(--absent);"></div><span class="st-lbl">缺席</span><span class="st-num" id="cn-a" style="color:var(--absent);">0</span></div>
      <div class="st-item"><div class="st-dot" style="background:var(--early);"></div><span class="st-lbl">早退</span><span class="st-num" id="cn-e" style="color:var(--early);">0</span></div>
      <div class="st-item" style="margin-left:auto;"><span class="st-lbl">完成進度</span><span class="st-num" id="cn-prog" style="color:var(--yellow);">0/15</span></div>
    </div>
    <div class="prog-wrap"><div class="prog-bar" id="progBar" style="width:0%"></div></div>
  </div>

  <!-- Student list -->
  <div class="list-card">
    <div class="list-hdr">
      <h3>學生名單</h3>
      <span class="ct-badge" id="listBadge">中二 2A · 15 人</span>
      <span class="list-hint">點擊狀態即時記錄 · 再點取消</span>
    </div>
    <div id="sList"></div>
  </div>

  <!-- Bottom bar -->
  <div class="bot-bar">
    <button class="bot-btn bb-lock" onclick="toggleLock()">🔒 鎖定點名記錄</button>
    <button class="bot-btn bb-export" onclick="showToast('📥','匯出功能將於接駁 Supabase 後啟用')">📥 匯出 Excel</button>
    <div class="bot-status" id="botSt">尚未開始點名</div>
  </div>

</main>

<!-- Toast -->
<div class="toast" id="toast">
  <span id="toastIco">✅</span>
  <span id="toastMsg">已儲存</span>
</div>

<!-- Mobile overlay -->
<div id="mobOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:190;" onclick="closeMob()"></div>

<script>

  {no:12,id:'S012', n:'梁心怡', e:'Leung Sum Yi',    bg:'rgba(245,158,11,.2)',  fc:'#FCD34D'},
  {no:13,id:'S013', n:'許志遠', e:'Hui Chi Yuen',    bg:'rgba(6,182,212,.2)',   fc:'#67E8F9'},
  {no:14,id:'S014', n:'馮美琪', e:'Fung Mei Ki',     bg:'rgba(168,85,247,.2)',  fc:'#D8B4FE'},
  {no:15,id:'S015', n:'盧家明', e:'Lo Ka Ming',      bg:'rgba(34,197,94,.2)',   fc:'#86EFAC'},
];

const STATUSES = [
  {k:'present', l:'出席', s:'出', cls:'sp'},
  {k:'late',    l:'遲到', s:'遲', cls:'sl'},
  {k:'sick',    l:'病假', s:'病', cls:'ss'},
  {k:'personal',l:'事假', s:'事', cls:'sv'},
  {k:'absent',  l:'缺席', s:'缺', cls:'sa'},
  {k:'early',   l:'早退', s:'退', cls:'se'},
];

const REASONS = {
  late:     ['交通問題','起床遲','家庭原因','其他'],
  personal: ['家庭事務','外出比賽 / 活動','宗教原因','政府傳召','其他'],
  absent:   ['無通知（電話聯絡家長）','家長通知書面','原因不明','其他'],
  early:    ['醫生預約','身體不適','家庭原因','其他'],
};

const NEED_DETAIL  = ['late','personal','absent','early'];
const NEED_NOTIFY  = ['late','personal','absent','early'];

let rec = {}, locked = false, filtered = false, sess = 'AM', startT = null;
STUDENTS.forEach(s => {
  rec[s.id] = { st:'unset', min:'', reason:'', custom:'', note:'', notify:false, flag:false };
});

/* ── Render ── */
function renderList() {
  const c = document.getElementById('sList');
  c.innerHTML = '';
  STUDENTS.forEach(s => {
    const r = rec[s.id];
    const needDet = NEED_DETAIL.includes(r.st);
    const div = document.createElement('div');
    div.className = 's-row' + (filtered && r.st !== 'unset' ? ' hide' : '');
    div.id = 'row-' + s.id;
    div.dataset.st = r.st;
    div.innerHTML = `
      <div class="row-main">
        <span class="s-no">${String(s.no).padStart(2,'0')}</span>
        <div class="s-av" style="background:${s.bg};color:${s.fc};">${s.n[0]}</div>
        <div class="s-name"><h4>${s.n}</h4><p>${s.e}</p></div>
        <div class="st-btns">
          ${STATUSES.map(st => `
            <button class="stb${r.st===st.k ? ' '+st.cls : ''}"
              onclick="setStatus('${s.id}','${st.k}')" title="${st.l}">
              <span class="stb-full">${st.l}</span>
              <span class="stb-short">${st.s}</span>
            </button>`).join('')}
        </div>
        <div class="act-btns">
          <button class="act-btn${r.note ? ' note-on' : ''}" onclick="toggleNote('${s.id}')" title="備注">📝</button>
          <button class="act-btn${r.flag ? ' flag-on' : ''}" onclick="toggleFlag('${s.id}')" title="需跟進">⚑</button>
        </div>
      </div>
      <div class="row-det${needDet ? ' open' : ''}" id="det-${s.id}">
        ${needDet ? buildDet(s.id) : ''}
      </div>`;
    c.appendChild(div);
  });
  updateStats();
}

/* ── Detail builder ── */
function buildDet(id) {
  const r = rec[id];
  const rs = REASONS[r.st] || [];
  let h = '<div class="det-grid">';

  // Tardiness minutes
  if (r.st === 'late') {
    h += `<div class="det-item"><label>遲到分鐘</label>
      <input type="number" class="det-in" style="width:90px" min="1" max="90"
        value="${r.min}" placeholder="分鐘"
        oninput="rec['${id}'].min=this.value;doSave()">
    </div>`;
  }

  // Reason dropdown
  if (rs.length) {
    h += `<div class="det-item"><label>原因</label>
      <select class="det-in" onchange="setReason('${id}',this.value)">
        <option value="">請選擇原因…</option>
        ${rs.map(x => `<option${r.reason===x?' selected':''}>${x}</option>`).join('')}
      </select>
    </div>`;
  }

  // Custom reason
  if (r.reason === '其他') {
    h += `<div class="det-item"><label>自行輸入</label>
      <input type="text" class="det-in" style="width:190px"
        value="${r.custom}" placeholder="請輸入原因…"
        oninput="rec['${id}'].custom=this.value;doSave()">
    </div>`;
  }

  // Notify parent
  if (NEED_NOTIFY.includes(r.st)) {
    h += `<div class="det-item" style="padding-top:18px;">
      <label class="notify-row${r.notify?' notify-active':''}">
        <input type="checkbox" ${r.notify?'checked':''}
          onchange="rec['${id}'].notify=this.checked;this.parentElement.className='notify-row'+(this.checked?' notify-active':'');doSave()">
        需通知家長
      </label>
    </div>`;
  }

  // Note (always in detail)
  h += `<div class="det-item" style="flex:1;min-width:200px;"><label>備注</label>
    <input type="text" class="det-in" style="width:100%"
      value="${r.note}" placeholder="可選填備注…"
      oninput="rec['${id}'].note=this.value;updNoteBtn('${id}');doSave()">
  </div>`;

  h += '</div>';
  return h;
}

function buildNoteOnly(id) {
  const r = rec[id];
  return `<div class="det-grid">
    <div class="det-item" style="flex:1;min-width:200px;"><label>備注</label>
      <input type="text" class="det-in" style="width:100%;max-width:420px"
        value="${r.note}" placeholder="可選填備注…" autofocus
        oninput="rec['${id}'].note=this.value;updNoteBtn('${id}');doSave()">
    </div>
  </div>`;
}

/* ── Actions ── */
function setStatus(id, st) {
  if (locked) { showToast('⛔','點名已鎖定，請先解鎖'); return; }
  if (!startT) { startT = new Date(); document.getElementById('aStart').textContent = fmt(startT); }

  const r = rec[id];
  r.st = (r.st === st) ? 'unset' : st;
  if (!NEED_DETAIL.includes(r.st)) { r.reason=''; r.custom=''; r.min=''; r.notify=false; }

  const row = document.getElementById('row-' + id);
  row.dataset.st = r.st;

  // Refresh status buttons
  row.querySelectorAll('.stb').forEach((btn, i) => {
    btn.className = 'stb' + (r.st === STATUSES[i].k ? ' ' + STATUSES[i].cls : '');
  });

  // Refresh detail
  const det = document.getElementById('det-' + id);
  const needDet = NEED_DETAIL.includes(r.st);
  det.innerHTML = needDet ? buildDet(id) : '';
  det.className = 'row-det' + (needDet ? ' open' : '');

  if (filtered && r.st !== 'unset') row.classList.add('hide');
  else row.classList.remove('hide');

  updateStats(); doSave();
}

function setReason(id, val) {
  rec[id].reason = val; doSave();
  document.getElementById('det-' + id).innerHTML = buildDet(id);
}

function toggleNote(id) {
  const r = rec[id];
  if (NEED_DETAIL.includes(r.st)) return; // note already inside detail
  const det = document.getElementById('det-' + id);
  if (det.classList.contains('open')) {
    det.classList.remove('open'); det.innerHTML = '';
  } else {
    det.innerHTML = buildNoteOnly(id);
    det.classList.add('open');
    setTimeout(() => { const i = det.querySelector('input'); if(i) i.focus(); }, 50);
  }
}

function updNoteBtn(id) {
  const btn = document.querySelector('#row-' + id + ' .act-btn:first-child');
  if (btn) btn.className = 'act-btn' + (rec[id].note ? ' note-on' : '');
}

function toggleFlag(id) {
  rec[id].flag = !rec[id].flag;
  const btn = document.querySelector('#row-' + id + ' .act-btn:last-child');
  if (btn) btn.className = 'act-btn' + (rec[id].flag ? ' flag-on' : '');
  doSave();
  showToast(rec[id].flag ? '⚑' : '✓', rec[id].flag ? '已標記需跟進' : '已取消標記');
}

function markAllPresent() {
  if (locked) { showToast('⛔','點名已鎖定'); return; }
  if (!startT) { startT = new Date(); document.getElementById('aStart').textContent = fmt(startT); }
  STUDENTS.forEach(s => {
    rec[s.id] = { st:'present', min:'', reason:'', custom:'', note:rec[s.id].note, notify:false, flag:rec[s.id].flag };
  });
  renderList();
  showToast('✅', '全部 ' + STUDENTS.length + ' 位學生標記為出席');
}

function clearAll() {
  if (locked) { showToast('⛔','點名已鎖定'); return; }
  if (!confirm('確認清除全部點名記錄？')) return;
  STUDENTS.forEach(s => { rec[s.id] = { st:'unset', min:'', reason:'', custom:'', note:'', notify:false, flag:false }; });
  startT = null;
  document.getElementById('aStart').textContent = '—';
  document.getElementById('aDone').textContent = '—';
  renderList(); showToast('🗑','已清除全部記錄');
}

function toggleFilter() {
  filtered = !filtered;
  const btn = document.getElementById('fltBtn');
  btn.classList.toggle('on', filtered);
  btn.textContent = filtered ? '👁 顯示全部' : '👁 只顯示未點名';
  document.querySelectorAll('.s-row').forEach(row => {
    if (filtered && row.dataset.st !== 'unset') row.classList.add('hide');
    else row.classList.remove('hide');
  });
}

function toggleLock() {
  locked = !locked;
  document.getElementById('lockPill').className = 'lock-pill ' + (locked ? 'lp-locked' : 'lp-open');
  document.getElementById('lockIco').textContent = locked ? '🔒' : '🔓';
  document.getElementById('lockTxt').textContent = locked ? '點名已鎖定' : '點名進行中';
  if (locked) {
    document.getElementById('aDone').textContent = fmt(new Date());
    showToast('🔒','點名記錄已鎖定，如需修改請先解鎖');
  } else {
    showToast('🔓','點名記錄已解鎖');
  }
}

function setSess(s) {
  sess = s;
  document.getElementById('sAM').classList.toggle('active', s === 'AM');
  document.getElementById('sPM').classList.toggle('active', s === 'PM');
  STUDENTS.forEach(st => { rec[st.id] = { st:'unset', min:'', reason:'', custom:'', note:'', notify:false, flag:false }; });
  locked = false; startT = null;
  document.getElementById('lockPill').className = 'lock-pill lp-open';
  document.getElementById('lockIco').textContent = '🔓';
  document.getElementById('lockTxt').textContent = '點名進行中';
  document.getElementById('aStart').textContent = '—';
  document.getElementById('aDone').textContent = '—';
  renderList();
  showToast('ℹ️', (s === 'AM' ? '🌤 上午' : '🌙 下午') + ' 點名已切換');
}

function updateStats() {
  const c = { unset:0, present:0, late:0, sick:0, personal:0, absent:0, early:0 };
  STUDENTS.forEach(s => { const st = rec[s.id].st; c[st] = (c[st]||0) + 1; });
  const total = STUDENTS.length, done = total - c.unset;
  document.getElementById('cn-u').textContent = c.unset;
  document.getElementById('cn-p').textContent = c.present;
  document.getElementById('cn-l').textContent = c.late;
  document.getElementById('cn-s').textContent = c.sick;
  document.getElementById('cn-v').textContent = c.personal;
  document.getElementById('cn-a').textContent = c.absent;
  document.getElementById('cn-e').textContent = c.early;
  document.getElementById('cn-prog').textContent = done + '/' + total;
  document.getElementById('progBar').style.width = (done / total * 100) + '%';
  const bs = document.getElementById('botSt');
  bs.innerHTML = c.unset === 0
    ? '<span style="color:#22C55E">✅ 全部 ' + total + ' 人完成</span>'
    : '尚餘 <strong style="color:var(--yellow)">' + c.unset + '</strong> 人未點名';
}

let saveTimer = null;
function doSave() {
  const dot = document.getElementById('saveDot'), txt = document.getElementById('saveTxt');
  dot.className = 'save-dot busy'; txt.textContent = '儲存中…';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    dot.className = 'save-dot';
    txt.textContent = '草稿已儲存 ' + fmt(new Date());
  }, 700);
}

function showToast(ico, msg) {
  const t = document.getElementById('toast');
  document.getElementById('toastIco').textContent = ico;
  document.getElementById('toastMsg').textContent = msg;
  t.classList.add('on'); clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('on'), 3200);
}

function fmt(d) {
  return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}

// Mobile menu
document.getElementById('mobMenu').addEventListener('click', () => {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('mobOverlay').style.display = 'block';
});
function closeMob() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('mobOverlay').style.display = 'none';
}

renderList();
</script>
</body>
</html>
